<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>投稿4 リール①の表紙｜そらメモ Instagram 画像案</title>
<style>
:root{
  --gothic:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans CJK JP","Noto Sans JP","Yu Gothic UI","Yu Gothic","Meiryo",system-ui,sans-serif;
  --mincho:"Hiragino Mincho ProN","Noto Serif CJK JP","Noto Serif JP","Yu Mincho",serif;
  --bg:#EEF1F5; --card:#FFFFFF; --ink:#374151; --ink-strong:#1F2937; --sub:#6B7280; --mute:#9CA3AF;
  --track:#E5E8EE; --pill:rgba(17,24,39,.06);
  --shadow:0 1px 2px rgba(17,24,39,.04),0 10px 30px -8px rgba(17,24,39,.12),inset 0 0 0 1px rgba(17,24,39,.06);
  --hero:#0F1B2D; --gold:#E8C46A; --gold-ink:#3B2E0A; --flap:#F2B544;
  --jal:#C8102E; --ana:#1C4FA0; --ana-wash:#EAF0FA;
  --chart-bg:#F3F4F1; --chart-land:#E7EAE3; --chart-coast:#A9B8C9; --chart-apt:#1F4E79;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#D9DEE6;font-family:var(--gothic);color:var(--ink);-webkit-text-size-adjust:100%}
.wrap{display:flex;flex-direction:column;align-items:center;gap:20px;padding:20px 16px 40px}
.wrap>h1{font-size:15px;color:var(--ink-strong);margin:0;max-width:360px;width:100%}
.wrap>p.how{font-size:12px;color:var(--sub);margin:-12px 0 0;max-width:360px;width:100%;line-height:1.6}
.s{width:360px;height:450px;flex:none;position:relative;overflow:hidden;background:var(--bg);font-feature-settings:"palt";line-height:1.6}
.s.story{height:640px}
.pad{position:absolute;inset:0;padding:30px 26px 0}
.eyebrow{font-size:11px;font-weight:700;color:var(--sub);letter-spacing:.1em;margin:0 0 8px}
.ttl{font-size:25px;line-height:1.38;font-weight:800;color:var(--ink-strong);margin:0;letter-spacing:-.01em}
.ttl small{display:block;font-size:13px;font-weight:700;color:var(--sub);margin-top:8px;letter-spacing:0;line-height:1.6}
.foot{position:absolute;z-index:5;left:0;right:0;bottom:0;height:40px;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:10.5px;color:var(--mute);font-weight:700}
.foot .logo{display:flex;align-items:center;gap:6px;color:var(--ink-strong);font-size:12px;letter-spacing:.18em}
.foot .logo svg{width:15px;height:15px}
.foot .np{background:var(--pill);color:var(--sub);padding:3px 10px;border-radius:999px;letter-spacing:.02em}
.foot .no{font-variant-numeric:tabular-nums}
.dark .foot .logo{color:#E8ECF1}.dark .foot .np{background:rgba(255,255,255,.1);color:#C9D1DC}.dark .foot{color:#8B95A3;background:var(--hero)}
.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow)}
.pillrow{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:5px 11px;border-radius:999px;background:var(--card);color:var(--ink-strong);box-shadow:var(--shadow)}
.pill.on{background:var(--ink-strong);color:#fff;box-shadow:none}
.mock{font-size:9.5px;color:var(--mute);font-weight:700}
/* 空港コード（パタパタ） */
.flap{display:flex;gap:4px}
.flap span{width:34px;height:44px;border-radius:6px;background:#1A2433;color:var(--flap);display:grid;place-items:center;font-size:26px;font-weight:800;position:relative;font-family:ui-monospace,"DejaVu Sans Mono",monospace;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.flap span::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(0,0,0,.6)}
/* チェックインの券 */
.ticket{display:flex;border-radius:20px;overflow:hidden;box-shadow:0 14px 30px -14px rgba(15,27,45,.55)}
.ticket .l{flex:1;background:var(--hero);color:#E8ECF1;padding:14px 16px}
.ticket .l small{display:block;font-size:10px;color:#9AA6B6;font-weight:700}
.ticket .l b{display:block;font-size:16px;margin-top:8px}
.ticket .l i{display:block;font-style:normal;font-size:10.5px;color:#9AA6B6}
.ticket .l i em{font-style:normal;color:#7EE2A8;font-weight:700}
.ticket .r{width:82px;background:var(--gold);color:var(--gold-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border-left:2px dashed rgba(59,46,10,.3);font-weight:800}
.ticket .r .v{writing-mode:vertical-rl;font-size:15px;letter-spacing:.2em}
.ticket .r small{font-size:9px;font-weight:700;opacity:.8}
/* 印 */
.stamp{width:100%;height:100%}
.num{font-variant-numeric:tabular-nums;font-weight:800;color:var(--ink-strong)}
.num u{text-decoration:none;font-size:.42em;color:var(--mute);font-weight:700;margin-left:3px}
</style>
</head>
<body>
<main class="wrap">
<h1>投稿4 リール①の表紙</h1>
<p class="how">リールの表紙（9:16）。グリッドでは真ん中の4:5（上下を切った部分）が見えるので、文字は真ん中に寄せた。PNG は1080×1920（png/post4-reel1-cover.png）。</p>
<section class="s story dark" id="st1" style="background:var(--hero);color:#E8ECF1">
  <div style="position:absolute;left:26px;right:26px;top:128px">
    <p class="eyebrow" style="color:#9AA6B6">15秒で分かる</p>
    <h2 class="ttl" style="font-size:31px;color:#F3F4F6">空港で、<br>印を押すまで。</h2>
  </div>
  <div style="position:absolute;left:26px;right:26px;top:268px">
    <div class="ticket" style="box-shadow:0 14px 30px -10px rgba(0,0,0,.6)">
      <div class="l" style="background:#1A2433"><small>いちばん近い空港</small>
        <div class="flap" style="margin-top:6px"><span>H</span><span>N</span><span>D</span></div>
        <b style="margin-top:8px">東京国際空港（羽田）</b><i>判定範囲の中にいます</i></div>
      <div class="r"><span class="v">チェックイン</span><small>→ 引いて切る</small></div>
    </div>
  </div>
  <div style="position:absolute;right:30px;top:410px;width:112px;height:112px;transform:rotate(-8deg)">
    <svg class="stamp" viewBox="0 0 120 120" aria-hidden="true">
      <circle cx="60" cy="60" r="54" fill="rgba(255,255,255,.92)" stroke="var(--ana)" stroke-width="4"/>
      <circle cx="60" cy="60" r="46" fill="none" stroke="var(--ana)" stroke-width="1.2"/>
      <text x="60" y="40" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ana)" font-family="var(--gothic)">東京国際</text>
      <text x="60" y="72" text-anchor="middle" font-size="30" font-weight="800" fill="var(--ana)" font-family="var(--mincho)">HND</text>
      <path d="M30 80 H90" stroke="var(--ana)" stroke-width="1"/>
      <text x="60" y="94" text-anchor="middle" font-size="9" font-weight="700" fill="var(--ana)" font-family="var(--gothic)">2026/11/17</text>
    </svg>
  </div>
  <div class="foot" style="height:56px"><span class="logo"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><path d="M7 13 17 7l-4 11-2-4z" fill="currentColor"/></svg>そらメモ</span><span class="np">非公式アプリ・画面は見本</span><span class="no">soramemo.jp</span></div>
</section>
</main>
</body>
</html>
