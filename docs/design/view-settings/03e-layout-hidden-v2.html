:root{--gothic:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic","Meiryo","Noto Sans JP","Noto Sans CJK JP",system-ui,sans-serif;--sign:"Sign","Barlow Condensed","Arial Narrow",var(--gothic)}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--gothic);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
.phone{position:relative;max-width:420px;margin:0 auto;overflow:hidden;min-height:100vh}
.wrap{padding:6px 16px 120px}
.card{background:var(--card);border-radius:22px;box-shadow:var(--shadow)}
.u{font-family:var(--gothic);font-size:12px;font-weight:600;color:var(--mute);margin-left:3px;letter-spacing:0}
.num{font-family:var(--sign);font-weight:700;color:var(--strong);line-height:1;letter-spacing:.01em}
.top{display:flex;align-items:center;gap:8px;height:60px}
.top h1{font-size:26px;margin:0 auto 0 2px;color:var(--strong);letter-spacing:.04em}
.pill{min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:700;color:var(--ink);background:var(--card);box-shadow:var(--shadow);border-radius:999px;padding:0 16px;flex:none;text-decoration:none}
.pill.dark{background:var(--navy);color:#fff}
.pill.ic{width:44px;padding:0}
.vband{display:flex;gap:6px;align-items:center;margin:10px 0 0}
.vband .pill{box-shadow:none;background:transparent;color:var(--sub);padding:0 14px;min-width:52px}
.vband .pill.on{background:var(--navy);color:#fff}
.vband .ed{margin-left:auto;width:44px;padding:0}
.seg{display:flex;background:#E2E6EC;border-radius:999px;padding:4px}
.seg b{flex:1;min-height:40px;display:flex;align-items:center;justify-content:center;border-radius:999px;font-size:14px;color:var(--sub);padding:0 14px}
.seg b.on{background:var(--card);color:var(--strong);box-shadow:var(--shadow)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;width:calc(min(420px,100vw) - 28px);height:64px;border-radius:999px;background:rgba(255,255,255,.96);box-shadow:0 10px 30px -8px rgba(17,24,39,.22),0 0 0 1px rgba(17,24,39,.04);display:flex;z-index:40}
.tabs b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:13px;font-weight:700;color:#5F6875;position:relative}
.tabs b.on{color:#1F2937}.tabs b.on::after{content:"";position:absolute;bottom:5px;width:5px;height:5px;border-radius:50%;background:var(--acc)}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabs b.on svg{stroke:var(--acc)}
.sec-h{display:flex;align-items:baseline;gap:8px;margin:22px 4px 8px;font-size:15px;font-weight:800;color:var(--strong)}
.sec-h small{font-size:13px;color:var(--sub);font-weight:600}
.sec-h .r{margin-left:auto;font-size:13px;color:var(--sub);font-weight:700}
.note{font-size:13px;color:var(--sub);margin:8px 4px 0;line-height:1.6}
.ann{position:relative;z-index:10;margin:24px 0 0;font:13px/1.7 var(--gothic);background:#FFF6DC;color:#4A3D10;padding:12px 14px;border-radius:16px}
.ann b{display:block}.ann ul{margin:4px 0 0;padding-left:1.2em}
.chip{display:inline-flex;align-items:center;min-height:26px;padding:0 10px;border-radius:999px;font-size:13px;font-weight:700;background:var(--wash);color:var(--sub)}
.row{display:flex;align-items:center;gap:12px;min-height:56px;padding:6px 16px}
.row .tx{flex:1;min-width:0}.row .tx b{display:block;color:var(--strong);font-size:15px;line-height:1.4}.row .tx small{display:block;color:var(--sub);font-size:13px;line-height:1.5}
.btn{min-height:52px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;background:var(--navy);color:#fff;margin-top:14px}
.btn.w{background:var(--card);color:var(--strong);box-shadow:var(--shadow)}
.dim{position:fixed;inset:0;background:rgba(15,23,42,.42);z-index:50}
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(420px,100vw);background:var(--card);border-radius:28px 28px 0 0;box-shadow:0 -10px 40px -10px rgba(15,23,42,.4);z-index:60;padding:10px 16px 28px}
.grab{width:40px;height:5px;border-radius:3px;background:#D5DAE1;margin:2px auto 10px}
.sw{width:68px;height:34px;border-radius:999px;display:flex;align-items:center;flex:none;position:relative;font-size:13px;font-weight:800}
.sw.on{background:#16233A;color:#fff;padding-left:12px}
.sw.on::after{content:"";position:absolute;right:4px;top:4px;width:26px;height:26px;border-radius:50%;background:#fff}
.sw.off{background:#E5E8EE;color:#4B5563;box-shadow:inset 0 0 0 1.5px #768090;justify-content:flex-end;padding-right:10px}
.sw.off::after{content:"";position:absolute;left:4px;top:4px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 1.5px #768090}
.tag-y{background:var(--yotei);color:var(--yotei-ink)}.tag-k{background:var(--keikaku);color:var(--keikaku-ink)}
.mi{display:inline-block;width:4px;height:16px;border-radius:2px;vertical-align:-2px;margin-right:6px}

.bgtop{display:flex;align-items:center;height:60px}.bgtop .lg{font-size:17px;font-weight:800;letter-spacing:.2em;color:var(--strong);margin-right:auto}
.bgh1{font-size:28px;font-weight:800;color:var(--strong);margin:6px 2px 0;letter-spacing:.04em}
.band{display:flex;align-items:center;gap:2px;margin-top:8px}
.band b{min-height:44px;display:flex;align-items:center;padding:0 10px;font-size:14px;color:var(--sub);position:relative}
.band b.on{color:var(--strong)}.band b.on::after{content:"";position:absolute;left:10px;right:10px;bottom:4px;height:3px;border-radius:2px;background:var(--navy)}
.band .pen{margin-left:auto;width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--sub)}
.ph{height:150px;margin-top:14px}.ph2{height:96px;margin-top:12px}
.dim{background:rgba(15,23,42,.46)}
.sheet{padding:8px 16px 0;max-height:78vh;display:flex;flex-direction:column}
.shd{flex:none;padding-bottom:6px}
.shd .hl{display:flex;align-items:center;gap:10px;min-height:52px}
.shd h3{font-size:21px;margin:0 auto 0 4px;color:var(--strong)}
.cnt{font-family:var(--sign);font-size:28px;font-weight:700;color:var(--strong)}.cnt small{font-family:var(--gothic);font-size:13px;color:var(--mute);font-weight:600;margin-left:2px}
.lead{font-size:13px;color:var(--sub);margin:0 4px}
.sbody{overflow:hidden;flex:1;padding-bottom:20px}
.gl{font-size:13px;font-weight:800;color:var(--sub);margin:16px 6px 0}
.vr{background:var(--wash);border-radius:16px;margin-top:8px;min-height:60px;padding:6px 12px 6px 16px}
.vr .ic{width:36px;height:36px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;color:var(--sub);flex:none}
.alw{width:68px;text-align:center;font-size:13px;font-weight:800;color:var(--sub);flex:none}
.vr.off .tx b{color:var(--sub)}
.sw.dis{opacity:.45}
.more{display:flex;align-items:center;min-height:44px;margin:10px 4px 0;font-size:14px;font-weight:800;color:var(--strong);gap:4px}
.undo{position:absolute;left:16px;right:16px;bottom:18px;min-height:52px;border-radius:999px;background:#1F2937;color:#fff;display:flex;align-items:center;padding:0 8px 0 20px;font-size:14px;font-weight:700;z-index:70;box-shadow:0 10px 30px -10px rgba(0,0,0,.5)}
.undo span{margin-right:auto}.undo .pill{background:transparent;box-shadow:none;color:#fff;text-decoration:underline;text-underline-offset:3px}
.msg{font-size:13px;color:var(--sub);background:var(--wash);border-radius:12px;padding:8px 12px;margin:8px 4px 0;font-weight:700}
/* 表示の編集の1枚 */
.lhd{position:fixed;left:50%;transform:translateX(-50%);top:0;width:min(420px,100vw);height:64px;background:var(--bg);display:flex;align-items:center;padding:0 16px;z-index:30}
.lhd h2{position:absolute;left:0;right:0;text-align:center;font-size:18px;margin:0;color:var(--strong);pointer-events:none}
.sc{position:fixed;left:50%;transform:translateX(-50%);top:64px;bottom:0;width:min(420px,100vw);overflow:hidden;padding:0 16px}
.hero{display:flex;align-items:baseline;gap:6px;margin:6px 4px 0}.hero .num{font-size:44px}
.hero .lb{font-size:13px;color:var(--sub);font-weight:700;margin-left:8px}
.flt{display:flex;gap:8px;margin:12px 0 0}.flt .pill{box-shadow:none;background:var(--card)}.flt .pill.on{background:var(--navy);color:#fff}
.sec{margin-top:14px;padding:4px 8px 10px}
.sh{display:flex;align-items:center;gap:10px;min-height:56px;padding:4px 8px;text-decoration:none;color:inherit}
.sh .ic{width:36px;height:36px;border-radius:50%;background:var(--wash);display:flex;align-items:center;justify-content:center;color:var(--strong);flex:none}
.sh .tt{flex:1;min-width:0}.sh .tt b{display:block;font-size:17px;color:var(--strong);line-height:1.3}.sh .tt small{display:block;font-size:13px;color:var(--sub);line-height:1.4}
.sh .go{font-size:13px;font-weight:800;color:var(--sub);display:flex;align-items:center;gap:2px;white-space:nowrap}
.sh .c2{font-family:var(--sign);font-size:20px;font-weight:700;color:var(--strong)}.sh .c2 small{font-family:var(--gothic);font-size:12px;color:var(--mute)}
.sec .vr{margin:6px 0 0}
.sec .gl{margin:12px 8px 0}
.sec .lnk{display:flex;align-items:center;min-height:44px;padding:0 8px;font-size:13px;font-weight:800;color:var(--sub);margin-top:4px}
.hl-ring{box-shadow:var(--shadow),0 0 0 3px #F2C14E}
.note2{font-size:13px;color:var(--sub);margin:16px 6px 0;line-height:1.6}
.reset{margin:12px 0 0}
.awaynote{font-size:13px;color:var(--sub);background:var(--wash);border-radius:12px;padding:8px 12px;margin:2px 8px 4px}

.vr .tx small{color:var(--sub)}
.vr.off .tx b{color:var(--mute)}.vr.off .tx small{color:var(--mute)}
.vr.dim2 .tx b,.vr.dim2 .tx small{color:var(--pale)}
.last{display:inline-flex;align-items:center;min-height:22px;padding:0 8px;border-radius:999px;background:var(--card);color:var(--sub);font-size:13px;font-weight:800;margin-left:6px;vertical-align:1px}
.msg2{font-size:13px;color:var(--sub);margin:6px 8px 0;font-weight:700}
.sbody{overflow-y:auto}
.sbody.pad{padding-bottom:88px}
.gl small{display:block;font-size:13px;font-weight:600;color:var(--sub);margin-top:2px}
/* 1枚：畳んだカード */
.lhd{box-shadow:0 8px 14px -12px rgba(17,24,39,.35)}
.sec{padding:2px 8px 4px}
.sh .tt small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh .c2{margin-left:4px}
.chev{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--sub);flex:none}
