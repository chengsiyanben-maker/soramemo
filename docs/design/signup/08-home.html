<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ホーム（登録直後）｜そらメモ新規登録の画面案</title>
<style>
:root{
  --gothic:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic","Meiryo","Noto Sans JP","Noto Sans CJK JP",system-ui,sans-serif;
  --bg:#F4F5F7; --card:#FFFFFF; --ink:#374151; --ink-strong:#1F2937; --sub:#6B7280; --mute:#9CA3AF;
  --track:#EEF0F3; --pill:rgba(17,24,39,.05);
  --shadow:0 1px 2px rgba(17,24,39,.04),0 10px 30px -8px rgba(17,24,39,.10),inset 0 0 0 1px rgba(17,24,39,.07);
  --jal:#C8102E; --ana:#1C4FA0; --ana-wash:#EEF3FB;
  --cta:#1F2937; --cta-text:#FFFFFF;
  --chart-bg:#F7F9F4; --chart-land:#E9EFE4; --chart-coast:#9FB3A4; --chart-apt:#1F4E79; --chart-route:#A3166B;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0B0D10; --card:#16191F; --ink:#E5E7EB; --ink-strong:#F3F4F6; --sub:#A7B0BC; --mute:#8B95A3;
  --track:#2A2F37; --pill:rgba(255,255,255,.07);
  --shadow:0 12px 26px -16px rgba(0,0,0,.7),inset 0 0 0 1px rgba(255,255,255,.06);
  --jal:#FF5A6E; --ana:#6EA0FF; --ana-wash:rgba(110,160,255,.12);
  --cta:#F3F4F6; --cta-text:#0B0D10;
  --chart-bg:#12161B; --chart-land:#1A2026; --chart-coast:#3A4A42; --chart-apt:#7FA6D9; --chart-route:#E07AB5;
}}
:root[data-theme=dark]{
  --bg:#0B0D10; --card:#16191F; --ink:#E5E7EB; --ink-strong:#F3F4F6; --sub:#A7B0BC; --mute:#8B95A3;
  --track:#2A2F37; --pill:rgba(255,255,255,.07);
  --shadow:0 12px 26px -16px rgba(0,0,0,.7),inset 0 0 0 1px rgba(255,255,255,.06);
  --jal:#FF5A6E; --ana:#6EA0FF; --ana-wash:rgba(110,160,255,.12);
  --cta:#F3F4F6; --cta-text:#0B0D10;
  --chart-bg:#12161B; --chart-land:#1A2026; --chart-coast:#3A4A42; --chart-apt:#7FA6D9; --chart-route:#E07AB5;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--gothic);font-size:16px;line-height:1.7;-webkit-text-size-adjust:100%}
.phone{max-width:420px;min-height:100vh;min-height:100svh;margin:0 auto;padding:20px 24px 32px;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;height:44px}
.back{width:40px;height:40px;border-radius:999px;border:0;background:var(--pill);color:var(--ink-strong);font-size:18px;display:grid;place-items:center}
.skip{border:0;background:var(--pill);color:var(--sub);font:inherit;font-size:13px;font-weight:700;padding:8px 14px;border-radius:999px}
.steps{display:flex;gap:6px;align-items:center}
.steps i{display:block;width:18px;height:6px;border-radius:999px;background:var(--track)}
.steps i.on{background:var(--ana);width:28px}
.steps i.done{background:var(--ink-strong);opacity:.35}
.stepno{font-size:12px;color:var(--mute);font-weight:700;letter-spacing:.04em}
.stepno b{font-size:15px;color:var(--ink-strong)}
.hero{margin-top:48px}
.eyebrow{font-size:12px;font-weight:700;color:var(--sub);letter-spacing:.08em;margin:0 0 10px}
h1{font-size:28px;line-height:1.35;color:var(--ink-strong);margin:0;font-weight:800;letter-spacing:-.01em}
.lead{color:var(--sub);font-size:14px;margin:14px 0 0}
.card{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:20px}
.field{margin-top:36px}
.label{display:block;font-size:12px;font-weight:700;color:var(--sub);margin:0 0 8px 4px}
.input{width:100%;font:inherit;font-size:18px;color:var(--ink-strong);background:var(--card);border:0;border-radius:18px;padding:16px 18px;box-shadow:var(--shadow);outline:none}
.input.focus{box-shadow:var(--shadow),0 0 0 2px var(--ana)}
.input::placeholder{color:var(--mute)}
.note{font-size:12px;color:var(--mute);margin:10px 4px 0}
.spacer{flex:1;min-height:24px}
.cta{display:block;width:100%;border:0;border-radius:999px;background:var(--cta);color:var(--cta-text);font:inherit;font-size:16px;font-weight:800;padding:17px 20px;text-align:center;text-decoration:none;box-shadow:0 10px 24px -12px rgba(15,23,42,.5)}
.cta[disabled]{opacity:.35;box-shadow:none}
.ghost{display:block;width:100%;border:0;background:transparent;color:var(--sub);font:inherit;font-size:14px;font-weight:700;padding:14px;text-align:center;text-decoration:none}
.pill2{display:block;width:100%;border:0;border-radius:999px;background:var(--pill);color:var(--ink-strong);font:inherit;font-size:15px;font-weight:700;padding:15px 20px;text-align:center;text-decoration:none}
.ann{max-width:372px;margin:0 auto 32px;font-size:12px;line-height:1.6;background:#FFF8D6;color:#5A4A12;padding:12px 14px;border-radius:16px}
.ann b{display:block;font-size:11px}
@media print{.ann{display:none}}
.phone{padding:0;position:relative;overflow:hidden}
.map{position:absolute;inset:0 0 auto 0;height:62vh;min-height:420px}
.map svg{width:100%;height:100%;display:block}
.chip{position:absolute;top:18px;left:16px;right:16px;display:flex;justify-content:space-between;gap:8px}
.chip span{font-size:12px;font-weight:700;background:var(--card);color:var(--ink-strong);padding:8px 14px;border-radius:999px;box-shadow:var(--shadow)}
.sheet{position:relative;margin-top:calc(max(62vh,420px) - 40px);background:var(--bg);border-radius:28px 28px 0 0;box-shadow:0 -18px 40px -18px rgba(15,23,42,.3);padding:10px 20px 32px;min-height:50vh}
.grab{width:40px;height:5px;border-radius:999px;background:var(--track);margin:0 auto 16px}
.welcome{display:flex;gap:12px;align-items:center;background:var(--ana-wash);border-radius:20px;padding:14px 16px}
.welcome b{display:block;color:var(--ink-strong);font-size:15px}
.welcome small{display:block;color:var(--sub);font-size:12px;line-height:1.5}
.welcome .x{margin-left:auto;flex:none;width:30px;height:30px;border-radius:999px;border:0;background:var(--card);color:var(--sub)}
.near{display:flex;align-items:center;gap:14px;margin-top:16px}
.flap{display:flex;gap:3px}
.flap span{width:30px;height:40px;border-radius:7px;background:#1B1F26;color:#F3F4F6;display:grid;place-items:center;font-size:22px;font-weight:800;position:relative;font-family:ui-monospace,monospace}
.flap span::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(0,0,0,.55)}
.near .nm b{display:block;font-size:16px;color:var(--ink-strong)}
.near .nm small{color:var(--mute);font-size:12px}
.near .dist{margin-left:auto;text-align:right}
.near .dist b{font-size:26px;font-weight:800;color:var(--ink-strong);font-variant-numeric:tabular-nums}
.near .dist small{font-size:12px;color:var(--mute);margin-left:2px}
.go{margin-top:18px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.tile{background:var(--card);box-shadow:var(--shadow);border-radius:20px;padding:14px 16px}
.tile small{display:block;font-size:12px;color:var(--mute)}
.tile b{font-size:28px;font-weight:800;color:var(--ink-strong)}
.tile b u{text-decoration:none;font-size:12px;color:var(--mute);font-weight:700;margin-left:3px}</style>
</head>
<body>
<main class="phone">

<div class="map">
  <svg viewBox="0 0 400 520" preserveAspectRatio="xMidYMid slice" aria-label="航空図風の地図">
    <rect width="400" height="520" fill="var(--chart-bg)"/>
    <path d="M-10 300 C60 270 120 330 190 300 S300 240 410 270 V520 H-10Z" fill="var(--chart-land)" stroke="var(--chart-coast)" stroke-width="1.4"/>
    <path d="M250 -10 C240 60 290 110 270 180 S320 240 410 230 V-10Z" fill="var(--chart-land)" stroke="var(--chart-coast)" stroke-width="1.4"/>
    <g stroke="var(--chart-coast)" stroke-width=".6" opacity=".5"><path d="M0 130 H400"/><path d="M0 390 H400"/><path d="M130 0 V520"/><path d="M290 0 V520"/></g>
    <circle cx="200" cy="250" r="72" fill="none" stroke="var(--chart-apt)" stroke-width="1.4" stroke-dasharray="5 5"/>
    <path d="M168 270 L232 228" stroke="var(--chart-apt)" stroke-width="6" stroke-linecap="round" opacity=".55"/>
    <path d="M178 232 L222 270" stroke="var(--chart-apt)" stroke-width="6" stroke-linecap="round" opacity=".4"/>
    <text x="200" y="345" text-anchor="middle" font-size="13" font-weight="700" fill="var(--chart-apt)" font-family="inherit">東京国際（羽田）</text>
    <circle cx="214" cy="258" r="16" fill="var(--ana)" opacity=".16"/>
    <circle cx="214" cy="258" r="7" fill="var(--ana)" stroke="#fff" stroke-width="2.5"/>
    <g fill="none" stroke="var(--chart-apt)" stroke-width="1.2" opacity=".6"><circle cx="330" cy="110" r="22"/></g>
    <text x="330" y="150" text-anchor="middle" font-size="11" fill="var(--chart-apt)" font-family="inherit" opacity=".8">成田</text>
  </svg>
  <div class="chip"><span>そらのたび人</span><span>印 <b>0</b></span></div>
</div>
<section class="sheet">
  <div class="grab"></div>
  <div class="welcome">
    <div><b>ようこそ、そらのたび人さん</b><small>空港の円の中で「チェックイン」を押すと、最初の印が押せます。</small></div>
    <button class="x" aria-label="閉じる">×</button>
  </div>
  <div class="near">
    <div class="flap" aria-label="いちばん近い空港 HND"><span>H</span><span>N</span><span>D</span></div>
    <div class="nm"><b>羽田</b><small>いちばん近い空港</small></div>
    <div class="dist"><b>0.4</b><small>km</small></div>
  </div>
  <div class="go"><a class="cta" href="index.html">チェックイン</a></div>
  <div class="tiles">
    <div class="tile"><small>集めた空港</small><b>0<u>/ 97</u></b></div>
    <div class="tile"><small>飛んだ区間</small><b>0<u>区間</u></b></div>
  </div>
</section>

</main>
<aside class="ann"><b>画面案メモ</b>今のホーム（地図とシート）に、登録直後だけ「ようこそ」カードを1枚足す案。案内板風は近い空港のコードだけ。アンケートで「撮りたい」を選んだ人には、このカードを撮影の機能の案内に差し替える想定。</aside>
<script>if(window!==window.top){var a=document.querySelector('.ann');if(a)a.remove()}</script>
</body>
</html>
