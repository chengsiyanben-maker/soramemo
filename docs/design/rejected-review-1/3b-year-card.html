<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>3b 1年のまとめ（共有の1枚・4:5）｜そらメモ 却下済みの見直し（検討用）</title><style>
:root{
  --gothic:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic","Meiryo","Noto Sans JP","Noto Sans CJK JP",system-ui,sans-serif;
  --sign:"Barlow Condensed","Arial Narrow",var(--gothic);
  --bg:#EEF1F5; --card:#FFFFFF; --ink:#374151; --strong:#1F2937; --sub:#5F6878; --mute:#6B7280; --line:#9CA3AF;
  --pill:rgba(17,24,39,.06); --hero:#0F1B2D; --on-hero:#F3F4F6; --hero-sub:#A7B0BC;
  --shadow:0 1px 2px rgba(17,24,39,.04),0 10px 30px -8px rgba(17,24,39,.10),inset 0 0 0 1px rgba(17,24,39,.07);
  --jal:#C8102E; --ana:#1C4FA0; --stub:#E7C873; --ok:#7EE2A8; --gold:#856620; --gold-wash:#FBF3DC;
  --chart-sea:#DCEAF3; --chart-land:#F4F2EA; --chart-coast:#A9B9AE; --chart-apt:#7A1F5C; --chart-grid:rgba(31,78,121,.10);
}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--gothic);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
.phone{position:relative;max-width:420px;min-height:100vh;min-height:100svh;margin:0 auto;overflow:hidden}
.wrap{padding:14px 16px 130px}
.card{background:var(--card);border-radius:22px;box-shadow:var(--shadow)}
.lab{font-size:13px;font-weight:700;color:var(--sub)}
.num{font-weight:800;color:var(--strong);letter-spacing:-.01em;line-height:1.1;font-variant-numeric:tabular-nums}
.u{font-size:12px;font-weight:600;color:var(--mute);margin-left:2px}
.tn{font-variant-numeric:tabular-nums}
h1.t{font-size:24px;line-height:1.3;color:var(--strong);margin:16px 4px 0}
.grp-h{font-size:14px;font-weight:800;color:var(--sub);margin:22px 4px 0}
.note{font-size:13px;color:var(--sub);margin:10px 4px 0;line-height:1.6}
.pl{height:44px;display:inline-flex;align-items:center;justify-content:center;padding:0 16px;border-radius:999px;font-size:14px;font-weight:800;background:var(--pill);color:var(--strong);white-space:nowrap}
.pl.dark{background:var(--strong);color:var(--card)}
.pl.w{background:var(--card);box-shadow:var(--shadow)}
.chip{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;font-size:13px;font-weight:800;background:var(--pill);color:var(--strong);white-space:nowrap}
.chip.gold{background:var(--gold-wash);color:var(--gold)}
.chip.ok{background:#DDF5E7;color:#14532D}
.back{height:44px;display:inline-flex;align-items:center;font-size:14px;font-weight:800;color:var(--strong);background:var(--card);box-shadow:var(--shadow);border-radius:999px;padding:0 14px 0 12px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ii{width:40px;height:40px;border-radius:999px;background:var(--pill);display:grid;place-items:center;flex:none;color:var(--strong)}
.rowl{display:flex;align-items:center;gap:12px;min-height:56px;padding:6px 0}
.rowl+.rowl{box-shadow:0 -1px 0 var(--pill)}
.rowl .tx{flex:1;min-width:0}
.rowl .tx b{display:block;font-size:15px;color:var(--strong);line-height:1.4}
.rowl .tx small{display:block;font-size:13px;color:var(--sub)}
.rowl .ar{color:var(--sub);font-size:18px}
.cardp{padding:16px 18px;margin-top:12px}
.cardp h3{margin:2px 0 0;font-size:17px;color:var(--strong);line-height:1.4}
.cardp p{margin:4px 0 0;font-size:14px}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.x{width:44px;height:44px;border-radius:999px;display:grid;place-items:center;color:var(--sub);flex:none;margin:-8px -10px -8px 0}
.bar6{height:8px;border-radius:8px;background:var(--pill);overflow:hidden;margin-top:10px}.bar6 i{display:block;height:100%;background:var(--strong);border-radius:8px}
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;width:calc(min(420px,100vw) - 28px);height:64px;border-radius:999px;background:rgba(255,255,255,.94);box-shadow:var(--shadow);display:flex;align-items:stretch;padding:0 8px;z-index:30}
.tabs b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;font-weight:700;color:var(--sub)}
.tabs b.on{color:var(--strong)}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.hmap{position:relative;height:250px;margin:-14px -16px 0;overflow:hidden}
.hmap>svg{display:block;width:100%;height:100%}
.topb{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:8px;align-items:center}
.mode{display:flex;background:var(--card);border-radius:999px;box-shadow:var(--shadow);padding:3px}
.mode span{height:40px;display:flex;align-items:center;padding:0 12px;border-radius:999px;font-size:13px;font-weight:700;color:var(--sub);white-space:nowrap}
.mode span.on{background:var(--strong);color:var(--card)}
.mp{margin-left:auto;height:46px;display:flex;align-items:center;gap:6px;padding:0 14px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);font-size:13px;font-weight:800;color:var(--strong);white-space:nowrap}
.hsheet{position:relative;margin:-30px -16px 0;background:var(--bg);border-radius:28px 28px 0 0;padding:10px 16px 0;box-shadow:0 -8px 30px -12px rgba(17,24,39,.18)}
.grip{width:44px;height:5px;border-radius:999px;background:var(--line);opacity:.6;margin:0 auto 12px}
.today{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.today>div{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:10px 14px}
.today .num{font-size:24px;margin-top:2px}
/* 印 */
.stamp{position:relative;aspect-ratio:1;border-radius:20px;background:var(--card);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:6px}
.stamp b{font-family:var(--sign);font-size:28px;font-weight:700;color:var(--strong);letter-spacing:.04em;line-height:1}
.stamp small{font-size:13px;color:var(--sub);margin-top:4px}
.stamp.off{background:transparent;box-shadow:inset 0 0 0 1.5px rgba(17,24,39,.12)}
.stamp.off b{color:var(--sub)}
.wx{position:absolute;right:6px;top:6px;width:26px;height:26px;border-radius:999px;background:#E8EEF6;color:#2B4A73;display:grid;place-items:center}
.wx svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.lim{background:var(--hero);color:var(--on-hero)}
.lim b{color:#F3E3B0}.lim small{color:var(--hero-sub)}
.ann{position:relative;z-index:40;max-width:392px;margin:16px auto 120px;font-size:13px;line-height:1.7;background:#FFF8D6;color:#5A4A12;padding:12px 14px;border-radius:16px}
.ann b{display:block}.ann ul{margin:4px 0 0;padding-left:1.2em}
.kentou{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:999px;background:#FDECC8;color:#6B4A00;font-size:13px;font-weight:800}
</style></head><body>
<main class="phone" style="padding:14px 16px 40px"><div style="width:358px;height:448px;margin:0 auto;border-radius:24px;background:#0F1B2D;color:#F3F4F6;padding:22px 22px 18px;position:relative;box-shadow:0 20px 40px -20px rgba(15,27,45,.5)">
<div style="font-size:13px;color:#A7B0BC;font-weight:700">2026年のそらメモ</div>
<div style="font-size:24px;font-weight:800;margin-top:2px">12空港 ・ 42便</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px">
<div><div style="font-size:13px;color:#A7B0BC">飛んだ距離</div><div style="font-size:30px;font-weight:800;line-height:1.1" class="tn">38,120<span style="font-size:12px;color:#A7B0BC;margin-left:2px">km</span></div></div>
<div><div style="font-size:13px;color:#A7B0BC">乗った機体</div><div style="font-size:30px;font-weight:800;line-height:1.1">31<span style="font-size:12px;color:#A7B0BC;margin-left:2px">機</span></div></div>
<div><div style="font-size:13px;color:#A7B0BC">いちばん通った空港</div><div style="font-size:22px;font-weight:800">羽田 <span style="font-size:13px;color:#A7B0BC">18回</span></div></div>
<div><div style="font-size:13px;color:#A7B0BC">見た特別塗装機</div><div style="font-size:30px;font-weight:800;line-height:1.1">5<span style="font-size:12px;color:#A7B0BC;margin-left:2px">機</span></div></div>
</div>
<svg viewBox="0 0 314 120" style="display:block;width:100%;margin-top:14px" role="img" aria-label="月ごとのフライトの数"><g fill="#F3E3B0">
<rect x="4" y="90" width="18" height="20" rx="4"/><rect x="30" y="80" width="18" height="30" rx="4"/><rect x="56" y="70" width="18" height="40" rx="4"/><rect x="82" y="96" width="18" height="14" rx="4"/><rect x="108" y="50" width="18" height="60" rx="4"/><rect x="134" y="86" width="18" height="24" rx="4"/><rect x="160" y="60" width="18" height="50" rx="4"/><rect x="186" y="30" width="18" height="80" rx="4"/><rect x="212" y="76" width="18" height="34" rx="4"/><rect x="238" y="66" width="18" height="44" rx="4"/><rect x="264" y="40" width="18" height="70" rx="4"/><rect x="290" y="92" width="18" height="18" rx="4"/></g></svg>
<div style="display:flex;justify-content:space-between;font-size:13px;color:#A7B0BC;margin-top:2px"><span>1月</span><span>月ごとのフライト</span><span>12月</span></div>
<div style="position:absolute;left:22px;right:22px;bottom:16px;display:flex;justify-content:space-between;font-size:13px;color:#A7B0BC"><span>そらメモ ・ 非公式アプリ</span><span>soramemo.jp</span></div>
</div></main>
<aside class="ann"><b>メモ（本番には出ません・検討用。却下を外したわけではありません）</b><ul><li>共有の1枚（4:5・1080×1350 で書き出す想定）。数字は実績だけ（乗った便・チェックイン・見た機体）。予想は入れない</li><li>航空会社のロゴ・塗装の絵は使わない。「非公式アプリ」を入れる</li><li>空港名は記録として出す。共有するときは自分で選んだ項目だけ出す（いちばん通った空港を隠せる）</li></ul></aside>

</body></html>
