<style>
:root{
  --gothic:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic","Meiryo","Noto Sans JP","Noto Sans CJK JP",system-ui,sans-serif;
  --sign:"Barlow Condensed","Arial Narrow",var(--gothic);
  --bg:#EEF1F5; --card:#FFFFFF; --ink:#374151; --strong:#1F2937; --sub:#6B7280; --mute:#9CA3AF;
  --pill:rgba(17,24,39,.05); --hero:#0F1B2D; --on-hero:#F3F4F6; --hero-sub:#A7B0BC;
  --shadow:0 1px 2px rgba(17,24,39,.04),0 10px 30px -8px rgba(17,24,39,.10),inset 0 0 0 1px rgba(17,24,39,.07);
  --jal:#C8102E; --ana:#1C4FA0; --gold:#A9822E; --stub:#E7C873;
  --chart-sea:#DCEAF3; --chart-land:#F4F2EA; --chart-coast:#A9B9AE; --chart-apt:#7A1F5C; --chart-grid:rgba(31,78,121,.10);
  --tabs:rgba(255,255,255,.92);
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0B0D10; --card:#16191F; --ink:#D1D5DB; --strong:#F3F4F6; --sub:#A7B0BC; --mute:#8B95A3;
  --pill:rgba(255,255,255,.07); --hero:#16233A; --on-hero:#F3F4F6; --hero-sub:#A7B0BC;
  --shadow:0 12px 26px -16px rgba(0,0,0,.7),inset 0 0 0 1px rgba(255,255,255,.06);
  --jal:#FF5A6E; --ana:#6EA0FF; --gold:#E0B85C;
  --chart-sea:#0F1A24; --chart-land:#1A1F24; --chart-coast:#3A4A42; --chart-apt:#E07AB5; --chart-grid:rgba(127,166,217,.10);
  --tabs:rgba(22,25,31,.92);
}}
:root[data-theme=dark]{
  --bg:#0B0D10; --card:#16191F; --ink:#D1D5DB; --strong:#F3F4F6; --sub:#A7B0BC; --mute:#8B95A3;
  --pill:rgba(255,255,255,.07); --hero:#16233A; --on-hero:#F3F4F6; --hero-sub:#A7B0BC;
  --shadow:0 12px 26px -16px rgba(0,0,0,.7),inset 0 0 0 1px rgba(255,255,255,.06);
  --jal:#FF5A6E; --ana:#6EA0FF; --gold:#E0B85C;
  --chart-sea:#0F1A24; --chart-land:#1A1F24; --chart-coast:#3A4A42; --chart-apt:#E07AB5; --chart-grid:rgba(127,166,217,.10);
  --tabs:rgba(22,25,31,.92);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--gothic);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
.phone{position:relative;max-width:420px;min-height:100vh;min-height:100svh;margin:0 auto;overflow:hidden}
button{font:inherit;color:inherit}
.pl{border:0;border-radius:999px;background:var(--pill);color:var(--strong);font-size:13px;font-weight:700;padding:8px 14px}
.card{background:var(--card);border-radius:22px;box-shadow:var(--shadow)}
.lab{font-size:12px;font-weight:700;color:var(--sub);letter-spacing:.02em}
.num{font-weight:800;color:var(--strong);letter-spacing:-.01em;line-height:1.1}
.u{font-size:12px;font-weight:600;color:var(--mute);margin-left:2px}
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;width:calc(min(420px,100vw) - 28px);height:64px;border-radius:999px;background:var(--tabs);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:space-around;backdrop-filter:blur(12px);z-index:30}
.tabs b{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--mute)}
.tabs b.on{color:var(--strong)}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ann{position:relative;z-index:40;max-width:392px;margin:16px auto 120px;font-size:12px;line-height:1.65;background:#FFF8D6;color:#5A4A12;padding:12px 14px;border-radius:16px}
.ann b{display:block;font-size:11px}
.ann ul{margin:4px 0 0;padding-left:1.2em}

.ix{max-width:720px;margin:0 auto;padding:32px 20px 60px}
.eyebrow{font-size:12px;font-weight:700;color:var(--sub);letter-spacing:.08em;margin:0 0 8px}
h1{font-size:26px;color:var(--strong);margin:0}
.lead{color:var(--sub);font-size:14px;margin:10px 0 0}
.pair{margin-top:40px}.pair h2{font-size:17px;color:var(--strong);margin:0}.d{font-size:13px;color:var(--sub);margin:2px 0 14px}
.two{display:flex;gap:24px;flex-wrap:wrap}
figure{margin:0;width:300px}figcaption{font-size:12px;font-weight:700;color:var(--mute);margin:0 0 6px 4px}
figure img{display:block;width:300px;height:649px;object-fit:cover;object-position:top;border-radius:30px;box-shadow:var(--shadow)}
.frame{width:300px;height:649px;border-radius:30px;overflow:hidden;box-shadow:var(--shadow);background:var(--bg)}
.frame iframe{width:390px;height:844px;border:0;transform:scale(.7692);transform-origin:0 0}
figure a{display:inline-block;margin-top:8px;font-size:12px;font-weight:700;color:var(--sub)}</style>
</head>
