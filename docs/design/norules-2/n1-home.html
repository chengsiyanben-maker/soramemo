<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>N1 ホーム｜決まりなしの実験 その2</title>
<style>*{box-sizing:border-box}html,body{margin:0}body{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans CJK JP","Noto Sans JP",system-ui,sans-serif;font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
.phone{position:relative;max-width:420px;min-height:100vh;min-height:100svh;margin:0 auto;overflow:hidden}
.ann{position:relative;z-index:99;max-width:392px;margin:16px auto 40px;font:13px/1.7 "Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans CJK JP","Noto Sans JP",system-ui,sans-serif;background:#FFF8D6;color:#5A4A12;padding:12px 14px;border-radius:16px}.ann b{display:block}
.unoff{font-size:13px}
body{background:#E9E6DF;color:#1F2328}.phone{background:#E9E6DF}
.floor{position:relative;height:380px;overflow:hidden;background:#D8D3C8}
.floor svg{width:100%;height:100%;display:block}
.sign{position:absolute;left:14px;top:14px;background:#1F2328;color:#F7F5F0;border-radius:10px;padding:8px 12px;font-weight:900;font-size:18px}.sign small{display:block;font-size:13px;font-weight:700;color:#D9D6CF}
.unoff{position:absolute;right:14px;top:16px;background:#F7F5F0;padding:2px 10px;border-radius:999px}
.info{padding:14px 16px 0}.info h2{margin:0;font-size:24px}.info p{margin:2px 0 0;color:#4A4F57}
.nums{display:flex;gap:10px;margin-top:12px}.nums div{flex:1;background:#F7F5F0;border-radius:12px;padding:8px 10px;border-left:8px solid}.nums b{font-size:28px;font-weight:900;display:block;line-height:1.1}.nums small{font-size:13px;color:#4A4F57}.u{font-size:13px;color:#4A4F57}
.lanes{margin:16px 0 30px}.lane{display:flex;align-items:center;min-height:50px;padding:0 16px;font-weight:900;font-size:15px;color:#1F2328;gap:10px}
.lane::before{content:"";width:36px;height:12px;border-radius:6px;background:var(--c)}.lane.on{background:var(--c)}.lane.on::before{background:#1F2328}
.pick{padding:16px 16px 40px}.pick h1{font-size:26px;margin:0}.pick p{color:#4A4F57;margin:4px 0 14px}
.ln{display:flex;align-items:center;gap:12px;min-height:60px;margin-top:8px;border-radius:14px;padding:0 8px 0 0;background:#F7F5F0;overflow:hidden}
.ln i{width:18px;align-self:stretch;background:var(--c)}.ln b{flex:1;font-size:18px}
.ln.off i{background:repeating-linear-gradient(45deg,#C9C4BA 0 6px,#F7F5F0 6px 12px)}.ln.off b{color:#5B6068}
.ln .sw{min-width:92px;height:44px;border-radius:999px;display:grid;place-items:center;font-weight:900;font-size:14px;background:#1F2328;color:#F7F5F0}.ln.off .sw{background:transparent;color:#1F2328;box-shadow:inset 0 0 0 2px #1F2328}</style></head><body>
<main class="phone"><div class="floor"><svg viewBox="0 0 390 380" preserveAspectRatio="xMidYMid slice" role="img" aria-label="床の色の帯：各タブへの道"><path d="M20 380C60 280 120 220 200 180S330 80 420 60" fill="none" stroke="#F2C230" stroke-width="12" stroke-linecap="round"/><path d="M34 380C74 280 140 220 216 170S330 94 420 76" fill="none" stroke="#3FA36B" stroke-width="12" stroke-linecap="round"/><path d="M48 380C88 280 160 220 232 160S330 108 420 92" fill="none" stroke="#3B82C4" stroke-width="12" stroke-linecap="round"/><path d="M62 380C102 280 180 220 248 150S330 122 420 108" fill="none" stroke="#E46A3A" stroke-width="12" stroke-linecap="round"/><path d="M76 380C116 280 200 220 264 140S330 136 420 124" fill="none" stroke="#9A6BD1" stroke-width="12" stroke-linecap="round"/><circle cx="60" cy="350" r="14" fill="#1F2328"/><circle cx="60" cy="350" r="5" fill="#F7F5F0"/></svg>
<div class="sign">羽田 HND まで 12.4km<small>黄の帯に沿って ホーム</small></div><span class="unoff">非公式アプリ・見本</span></div>
<div class="info"><h2>いちばん近い空港 羽田</h2><p>範囲に入ったら印を引けます</p>
<div class="nums"><div style="border-color:#F2C230"><b>0</b><small>今日の印</small></div><div style="border-color:#3FA36B"><b>14<span class="u">/86</span></b><small>空港</small></div><div style="border-color:#3B82C4"><b>23</b><small>便</small></div></div></div>
<nav class="lanes"><div class="lane on" style="--c:#F2C230">ホーム</div><div class="lane" style="--c:#3FA36B">図鑑</div><div class="lane" style="--c:#3B82C4">フライト</div><div class="lane" style="--c:#E46A3A">運用</div><div class="lane" style="--c:#9A6BD1">修行</div></nav></main>
<aside class="ann"><b>メモ（本番には出ません）</b>案N「床の色の帯」：空港の床に引いた色の帯のように、タブごとに色を決め、ホームから各画面へ帯がのびる。上の黒い札が行き先</aside>
<script>if(window!==window.top){var a=document.querySelector('.ann');if(a)a.remove()}</script>
</body></html>
