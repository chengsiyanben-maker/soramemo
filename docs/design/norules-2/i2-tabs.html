<style>*{box-sizing:border-box}html,body{margin:0}body{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans CJK JP","Noto Sans JP",system-ui,sans-serif;font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}

body{background:#F3EFE6;color:#2B2A27}.phone{background:#F3EFE6;padding:14px 16px 40px}

.sub{font-size:14px;color:#4A473F;margin:0 0 10px;font-weight:700}
.cols{display:grid;grid-template-columns:1.3fr 1fr;gap:0 14px;border-top:1px solid #2B2A27;padding-top:10px}

.row .pg{font:900 13px "Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans CJK JP","Noto Sans JP",system-ui,sans-serif;width:44px;color:#4A473F}.row b{flex:1;font:900 20px "Hiragino Mincho ProN","Yu Mincho","Noto Serif CJK JP","Noto Serif JP",serif}
.row .st{min-width:96px;height:44px;display:flex;align-items:center;justify-content:center;font:900 15px "Hiragino Mincho ProN","Yu Mincho","Noto Serif CJK JP","Noto Serif JP",serif;border:2px solid #1E1D1A}

<main class="phone"><div class="mast"><h1>そらメモ新報</h1><div class="d"><span>紙面の編集</span><span class="unoff">非公式アプリ・見本</span><span>5面</span></div></div>
<div class="ed"><h2>どの面を載せるか</h2><p class="lead">押すと「掲載」と「休刊」が入れ替わる。休刊の面はマイページから読める。</p><div class="row"><span class="pg">一面</span><b>ホーム</b><span class="st" style="border-style:dashed">いつも</span></div><div class="row"><span class="pg">2面</span><b>図鑑</b><span class="st on">掲載</span></div><div class="row"><span class="pg">3面</span><b>フライト</b><span class="st on">掲載</span></div><div class="row"><span class="pg">4面</span><b>運用</b><span class="st on">掲載</span></div><div class="row"><span class="pg">5面</span><b>修行</b><span class="st on">掲載</span></div><div class="row off"><span class="pg">休刊</span><b>成績</b><span class="st">休刊</span></div>
<p class="foot">面は5つまで。並べ替えは見出しを長押し。／全部の面を載せる（全部乗せに戻す）</p></div></main>
<aside class="ann"><b>メモ（本番には出ません）</b>案I「新聞の紙面」：タブは「面」。出す・隠すを「掲載／休刊」の判子にした。休刊は取り消し線と色の反転で、字でも分かる</aside>
