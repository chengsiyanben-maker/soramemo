<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>M2 タブを選ぶ｜決まりなしの実験 その2</title>
<style>*{box-sizing:border-box}html,body{margin:0}body{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans CJK JP","Noto Sans JP",system-ui,sans-serif;font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
.phone{position:relative;max-width:420px;min-height:100vh;min-height:100svh;margin:0 auto;overflow:hidden}
.ann{position:relative;z-index:99;max-width:392px;margin:16px auto 40px;font:13px/1.7 "Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans CJK JP","Noto Sans JP",system-ui,sans-serif;background:#FFF8D6;color:#5A4A12;padding:12px 14px;border-radius:16px}.ann b{display:block}
.unoff{font-size:13px}
body{background:#1F2B24;color:#EEF2EA}.phone{background:#1F2B24}
.terr{height:470px;position:relative}.terr svg{width:100%;height:100%;display:block}
.ttl{position:absolute;left:16px;top:14px;font-size:14px;font-weight:800;color:#EEF2EA}.unoff{position:absolute;right:16px;top:14px;color:#D6E0D0}
.lv{margin:-10px 14px 0;position:relative;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.lv div{border-radius:14px;padding:10px;background:#2C3D33}.lv div:nth-child(2){background:#3A5243}.lv div:nth-child(3){background:#4A6754}
.lv small{font-size:13px;color:#D6E0D0;display:block}.lv b{font-size:30px;font-weight:900}.u{font-size:13px;color:#D6E0D0;margin-left:2px}
.dist{margin:12px 14px 0;font-size:16px;font-weight:800}
.tabs{display:flex;margin:16px 14px 30px;gap:0;border-radius:18px;overflow:hidden}.tabs a{flex:1;min-height:52px;display:grid;place-items:center;font-size:13px;font-weight:800;background:#2C3D33}
.tabs a:nth-child(2){background:#33463A}.tabs a:nth-child(3){background:#3A5243}.tabs a:nth-child(4){background:#425C4B}.tabs a:nth-child(5){background:#4A6754}.tabs a.on{background:#EEF2EA;color:#1F2B24}
.pick{padding:16px 14px 40px}.pick h1{font-size:26px;margin:0}.pick p{color:#D6E0D0;margin:4px 0 14px}
.st{display:flex;align-items:center;gap:10px;min-height:62px;padding:0 10px 0 16px;color:#EEF2EA}
.st:nth-child(odd){}.st b{flex:1;font-size:18px}
.st .hh{font:700 13px ui-monospace,"SF Mono","Menlo","DejaVu Sans Mono",monospace;color:#D6E0D0;width:56px}
.sw{min-width:92px;height:44px;border-radius:999px;display:grid;place-items:center;font-weight:900;font-size:14px;background:#EEF2EA;color:#1F2B24}
.st.off{background:transparent!important;box-shadow:inset 0 0 0 1.5px #5E7A66}.st.off b{color:#B7C5B0}.st.off .sw{background:transparent;color:#D6E0D0;box-shadow:inset 0 0 0 1.5px #8DA48F}</style></head><body>
<main class="phone"><div class="pick"><span class="unoff" style="float:right;color:#D6E0D0">非公式アプリ・見本</span><h1>タブを選ぶ</h1><p>上の段ほど左のタブ。押すと「出す」と「隠す」が入れ替わり、隠した段は縁だけになります。</p><div style="border-radius:20px;overflow:hidden"><div class="st" style="background:#2C3D33"><span class="hh">100m</span><b>ホーム</b><span class="hh" style="width:auto;padding-right:8px">いつも</span></div><div class="st" style="background:#33463A"><span class="hh">200m</span><b>図鑑</b><span class="sw">出す</span></div><div class="st" style="background:#3A5243"><span class="hh">300m</span><b>フライト</b><span class="sw">出す</span></div><div class="st" style="background:#425C4B"><span class="hh">400m</span><b>運用</b><span class="sw">出す</span></div><div class="st" style="background:#4A6754"><span class="hh">500m</span><b>修行</b><span class="sw">出す</span></div><div class="st off" style="background:#52705C"><span class="hh">600m</span><b>成績</b><span class="sw">隠す</span></div></div>
<p style="font-weight:800;margin-top:16px">⟲ 全部の段を出す（全部乗せに戻す）</p></div></main>
<aside class="ann"><b>メモ（本番には出ません）</b>案M「等高線の地形」：タブの一覧を地形の段（高さの札つき）にした。隠すと段の色が抜けて縁だけ</aside>
<script>if(window!==window.top){var a=document.querySelector('.ann');if(a)a.remove()}</script>
</body></html>
