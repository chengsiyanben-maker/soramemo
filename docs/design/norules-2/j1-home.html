<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>J1 ホーム｜決まりなしの実験 その2</title>
<style>*{box-sizing:border-box}html,body{margin:0}body{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans CJK JP","Noto Sans JP",system-ui,sans-serif;font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
.phone{position:relative;max-width:420px;min-height:100vh;min-height:100svh;margin:0 auto;overflow:hidden}
.ann{position:relative;z-index:99;max-width:392px;margin:16px auto 40px;font:13px/1.7 "Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans CJK JP","Noto Sans JP",system-ui,sans-serif;background:#FFF8D6;color:#5A4A12;padding:12px 14px;border-radius:16px}.ann b{display:block}
.unoff{font-size:13px}
body{background:#F6EFE3;color:#2E2A24}.phone{background:#F6EFE3}
.sky{position:relative;height:420px;overflow:hidden}
.sky svg{position:absolute;inset:0;width:100%;height:100%}
.ttl{position:absolute;left:18px;top:16px;font-weight:900;font-size:22px;color:#2E2A24}
.unoff{position:absolute;right:16px;top:20px;color:#3F3A32;background:#F6EFE3;padding:2px 10px;border-radius:999px}
.paper{position:relative;margin:-40px 14px 0;background:#FFFDF8;border-radius:6px 22px 8px 18px;padding:18px;box-shadow:4px 6px 0 #D9C9AE,8px 12px 0 #B9A27F}
.paper h2{margin:0;font-size:15px;color:#5A5145}.paper .big{font-size:52px;font-weight:900;line-height:1;color:#2E2A24}.u{font-size:15px;color:#5A5145;font-weight:700;margin-left:4px}
.chips{display:flex;gap:10px;margin-top:14px}.chip{flex:1;background:#F0E4CF;border-radius:14px 4px 14px 6px;padding:8px 10px;box-shadow:3px 3px 0 #C9B48F}.chip b{display:block;font-size:24px}.chip small{font-size:13px;color:#5A5145}
.tabs{display:flex;gap:6px;margin:22px 14px 30px}.tabs a{flex:1;min-height:52px;display:grid;place-items:center;font-size:13px;font-weight:800;color:#2E2A24;background:#FFFDF8;border-radius:10px 18px 6px 14px;box-shadow:3px 4px 0 #C9B48F}
.tabs a.on{background:#2F5D50;color:#FFFDF8;box-shadow:3px 4px 0 #173A30;transform:translateY(-4px)}
.pick{padding:18px 14px 40px}.pick h1{font-size:26px;margin:4px 4px 6px}.pick p{margin:0 4px 16px;color:#5A5145}
.layer{position:relative;display:flex;align-items:center;gap:12px;min-height:64px;margin-top:12px;padding:0 10px 0 18px;background:#FFFDF8;border-radius:8px 20px 6px 16px;box-shadow:4px 5px 0 #C9B48F}
.layer b{flex:1;font-size:18px}.layer.off{background:transparent;box-shadow:none;border:2px dashed #A08C6C;transform:none}.layer.off b{color:#6B5F4E}
.layer .cut{min-width:92px;height:44px;border-radius:999px;display:grid;place-items:center;font-weight:900;font-size:14px;background:#2F5D50;color:#FFFDF8}
.layer.off .cut{background:#F0E4CF;color:#3F3A32}.lk{color:#5A5145;font-weight:800;font-size:14px;padding-right:10px}</style></head><body>
<main class="phone"><div class="sky"><svg viewBox="0 0 390 420" preserveAspectRatio="xMidYMid slice" role="img" aria-label="切り絵の地図：海と陸と羽田">
<rect width="390" height="420" fill="#BFD9D2"/><path d="M0 0H390V120C330 150 300 190 250 200C200 210 190 260 140 290C90 320 40 300 0 330Z" fill="#E8D6B5"/><path d="M0 0H390V90C330 120 300 160 250 170C200 180 190 230 140 260C90 290 40 270 0 300Z" fill="#D7BE93"/><path d="M0 0H390V60C330 90 290 130 240 140C190 150 170 200 120 225C80 245 40 240 0 260Z" fill="#B99A69"/>
<circle cx="270" cy="300" r="64" fill="#FFFDF8" opacity=".55"/><circle cx="270" cy="300" r="64" fill="none" stroke="#2F5D50" stroke-width="3" stroke-dasharray="8 6"/>
<path d="M245 340 275 262M258 350 288 272M232 296 312 312" stroke="#2E2A24" stroke-width="7" stroke-linecap="round"/>
<g transform="translate(70 70)"><circle r="12" fill="#2F5D50"/><circle r="5" fill="#FFFDF8"/></g></svg>
<div class="ttl">そらメモ</div><span class="unoff">非公式アプリ・見本</span></div>
<div class="paper"><h2>いちばん近い空港　羽田 HND</h2><div><span class="big">12.4</span><span class="u">km で範囲</span></div>
<div class="chips"><div class="chip"><b>0</b><small>今日の印</small></div><div class="chip"><b>14<span style="font-size:15px">/86</span></b><small>空港</small></div><div class="chip"><b>23</b><small>便</small></div></div></div>
<nav class="tabs"><a class="on">ホーム</a><a>図鑑</a><a>フライト</a><a>運用</a><a>修行</a></nav></main>
<aside class="ann"><b>メモ（本番には出ません）</b>案J「切り絵」：地図を色紙の重なりで描き、手前の紙（カード）は角の丸みをわざと不ぞろいに。影は薄くせず紙の厚みとしてずらす</aside>
<script>if(window!==window.top){var a=document.querySelector('.ann');if(a)a.remove()}</script>
</body></html>
