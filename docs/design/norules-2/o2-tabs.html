<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>O2 タブを選ぶ｜決まりなしの実験 その2</title>
<style>*{box-sizing:border-box}html,body{margin:0}body{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans CJK JP","Noto Sans JP",system-ui,sans-serif;font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
.phone{position:relative;max-width:420px;min-height:100vh;min-height:100svh;margin:0 auto;overflow:hidden}
.ann{position:relative;z-index:99;max-width:392px;margin:16px auto 40px;font:13px/1.7 "Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans CJK JP","Noto Sans JP",system-ui,sans-serif;background:#FFF8D6;color:#5A4A12;padding:12px 14px;border-radius:16px}.ann b{display:block}
.unoff{font-size:13px}
body{background:#FAF7F0;color:#33302B}.phone{background:#FAF7F0}
.wc{height:460px;position:relative}.wc svg{width:100%;height:100%;display:block}
.ttl{position:absolute;left:18px;top:16px;font:800 20px "Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans CJK JP","Noto Sans JP",system-ui,sans-serif;color:#33302B}.unoff{position:absolute;right:16px;top:20px;color:#4D483F;background:rgba(250,247,240,.8);padding:0 8px;border-radius:999px}
.note{position:absolute;left:18px;bottom:20px;right:18px}.note b{font-size:44px;font-weight:900;line-height:1}.note span{font-size:15px;font-weight:700;color:#4D483F;margin-left:6px}
.row3{display:flex;padding:8px 18px 0}.row3 div{flex:1}.row3 b{display:block;font-size:30px;font-weight:900}.row3 small{font-size:13px;color:#5C564C}.u{font-size:13px;color:#5C564C}
.tabs{display:flex;gap:4px;margin:18px 12px 30px}.tabs a{flex:1;min-height:52px;display:grid;place-items:center;font-size:13px;font-weight:800;border-radius:999px}.tabs a.on{background:radial-gradient(circle at 40% 40%,#9CC7DD,#7FB3CF 60%,#8EBBD4);color:#1E2A33}
.pick{padding:18px 16px 40px}.pick h1{font-size:26px;margin:0}.pick p{color:#5C564C;margin:4px 0 12px}
.blot{position:relative;display:flex;align-items:center;gap:10px;min-height:64px;padding:0 6px 0 22px;margin-top:6px}
.blot::before{content:"";position:absolute;inset:4px 0;border-radius:40% 60% 55% 45%/60% 40% 60% 40%;background:var(--w);opacity:.75;z-index:0}
.blot>*{position:relative}.blot b{flex:1;font-size:19px}
.blot.off::before{background:transparent;border:2px dashed #B4AB9C;opacity:1}.blot.off b{color:#6E675B}
.blot .sw{min-width:92px;height:44px;border-radius:999px;display:grid;place-items:center;font-weight:900;font-size:14px;background:#33302B;color:#FAF7F0}.blot.off .sw{background:#FAF7F0;color:#33302B;box-shadow:inset 0 0 0 2px #33302B}</style></head><body>
<main class="phone"><div class="pick"><span class="unoff" style="position:static;float:right">非公式アプリ・見本</span><h1>タブを選ぶ</h1><p>色をのせたタブが下に並びます。「白いまま」にすると点線の輪郭だけ残ります。</p><div class="blot" style="--w:#A9CFE0"><b>ホーム</b><span style="font-weight:800;color:#5C564C;padding-right:12px">いつも</span></div><div class="blot" style="--w:#C8DBB0"><b>図鑑</b><span class="sw">塗る</span></div><div class="blot" style="--w:#E7D9B8"><b>フライト</b><span class="sw">塗る</span></div><div class="blot" style="--w:#F3C6A5"><b>運用</b><span class="sw">塗る</span></div><div class="blot" style="--w:#D8C4E4"><b>修行</b><span class="sw">塗る</span></div><div class="blot off" style="--w:#DDD"><b>成績</b><span class="sw">白いまま</span></div>
<p style="font-weight:800;margin-top:16px">⟲ 全部塗り直す（全部乗せに戻す）</p></div></main>
<aside class="ann"><b>メモ（本番には出ません）</b>案O「水彩の地図」：タブは絵の具のしみ。出す＝色をのせる、隠す＝点線の輪郭だけ</aside>
<script>if(window!==window.top){var a=document.querySelector('.ann');if(a)a.remove()}</script>
</body></html>
