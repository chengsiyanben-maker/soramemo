<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Q2 タブを選ぶ｜決まりなしの実験 その2</title>
<style>*{box-sizing:border-box}html,body{margin:0}body{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans CJK JP","Noto Sans JP",system-ui,sans-serif;font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
.phone{position:relative;max-width:420px;min-height:100vh;min-height:100svh;margin:0 auto;overflow:hidden}
.ann{position:relative;z-index:99;max-width:392px;margin:16px auto 40px;font:13px/1.7 "Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans CJK JP","Noto Sans JP",system-ui,sans-serif;background:#FFF8D6;color:#5A4A12;padding:12px 14px;border-radius:16px}.ann b{display:block}
.unoff{font-size:13px}
body{background:#EAF0F6;color:#1E2733}.phone{background:linear-gradient(#DCE6F0,#EAF0F6 60%)}
.dio{height:420px;position:relative}.dio svg{width:100%;height:100%;display:block}
.ttl{position:absolute;left:16px;top:14px;font-size:20px;font-weight:900}.unoff{position:absolute;right:16px;top:18px;background:#fff;padding:0 10px;border-radius:999px;color:#3B4757}
.blk{display:flex;gap:10px;padding:0 16px}.blk div{flex:1;background:#fff;border-radius:10px;padding:8px 10px;box-shadow:0 6px 0 #B8C6D6,0 10px 14px rgba(30,39,51,.18)}.blk b{display:block;font-size:28px;font-weight:900}.blk small{font-size:13px;color:#3B4757}.u{font-size:13px;color:#3B4757}
.tabs{display:flex;gap:6px;margin:22px 12px 30px}.tabs a{flex:1;min-height:52px;display:grid;place-items:center;font-size:13px;font-weight:800;background:#fff;border-radius:10px;box-shadow:0 6px 0 #B8C6D6}.tabs a.on{background:#1E2733;color:#fff;box-shadow:0 2px 0 #0A0F16;transform:translateY(4px)}
.pick{padding:16px 16px 40px}.pick h1{font-size:26px;margin:0}.pick p{color:#3B4757;margin:4px 0 14px}
.bb{display:flex;align-items:center;gap:12px;min-height:62px;margin-top:14px;padding:0 8px 0 16px;background:#fff;border-radius:12px;box-shadow:0 8px 0 #B8C6D6,0 12px 16px rgba(30,39,51,.16)}
.bb b{flex:1;font-size:18px}.bb.off{background:#E1E8F0;box-shadow:inset 0 3px 0 #C3CFDC;margin-top:14px}.bb.off b{color:#4E5B6B}
.bb .sw{min-width:92px;height:44px;border-radius:10px;display:grid;place-items:center;font-weight:900;font-size:14px;background:#1E2733;color:#fff}.bb.off .sw{background:#fff;color:#1E2733;box-shadow:inset 0 0 0 2px #1E2733}</style></head><body>
<main class="phone"><div class="pick"><span class="unoff" style="position:static;float:right">非公式アプリ・見本</span><h1>タブを選ぶ</h1><p>出ているタブは厚みのある積み木。押すと板の中へしまわれ、へこんだ形になります。</p><div class="bb"><b>ホーム</b><span style="font-weight:800;color:#3B4757;padding-right:10px">いつも</span></div><div class="bb"><b>図鑑</b><span class="sw">出ている</span></div><div class="bb"><b>フライト</b><span class="sw">出ている</span></div><div class="bb"><b>運用</b><span class="sw">出ている</span></div><div class="bb"><b>修行</b><span class="sw">出ている</span></div><div class="bb off"><b>成績</b><span class="sw">しまった</span></div>
<p style="font-weight:800;margin-top:18px">⟲ 全部出す（全部乗せに戻す）</p></div></main>
<aside class="ann"><b>メモ（本番には出ません）</b>案Q「立体の模型」：タブは積み木。出す＝飛び出した厚み、隠す＝板の中にしまってへこむ。形の違いで分かる</aside>
