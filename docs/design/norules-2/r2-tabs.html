<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>R2 タブを選ぶ｜決まりなしの実験 その2</title>
<style>*{box-sizing:border-box}html,body{margin:0}body{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans CJK JP","Noto Sans JP",system-ui,sans-serif;font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
.phone{position:relative;max-width:420px;min-height:100vh;min-height:100svh;margin:0 auto;overflow:hidden}
.ann{position:relative;z-index:99;max-width:392px;margin:16px auto 40px;font:13px/1.7 "Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans CJK JP","Noto Sans JP",system-ui,sans-serif;background:#FFF8D6;color:#5A4A12;padding:12px 14px;border-radius:16px}.ann b{display:block}
.unoff{font-size:13px}
body{background:#FFF6EC;color:#1D2A55}.phone{background:#FFF6EC;padding:16px 16px 40px}
.hd{display:flex;justify-content:space-between;align-items:center}.hd b{font-size:22px;font-weight:900;color:#1D2A55}.unoff{background:#FF5C8A;color:#1D2A55;padding:2px 10px;border-radius:999px;font-weight:800}
.poster{position:relative;margin-top:12px;height:360px;border-radius:6px;overflow:hidden;background:#FFF6EC}
.poster svg{width:100%;height:100%;display:block}
.big{position:absolute;left:14px;bottom:12px;font-size:64px;font-weight:900;line-height:.9;color:#1D2A55;mix-blend-mode:multiply}.big small{font-size:18px;display:block;font-weight:800}
.nums{display:flex;gap:8px;margin-top:12px}.nums div{flex:1;padding:8px 10px;border-radius:8px;background:#FFE14D}.nums div:nth-child(2){background:#FF9DB8}.nums div:nth-child(3){background:#9BE7C4}
.nums b{display:block;font-size:30px;font-weight:900}.nums small{font-size:13px;font-weight:700}.u{font-size:13px}
.tabs{display:flex;gap:6px;margin-top:16px}.tabs a{flex:1;min-height:52px;display:grid;place-items:center;font-size:13px;font-weight:900;border:2px solid #1D2A55;border-radius:8px}.tabs a.on{background:#1D2A55;color:#FFF6EC}
h1{font-size:28px;margin:12px 0 0}.lead{margin:4px 0 12px;font-weight:600}
.pr{display:flex;align-items:center;gap:10px;min-height:62px;margin-top:8px;padding:0 8px 0 14px;border-radius:8px;background:var(--c)}
.pr b{flex:1;font-size:19px;font-weight:900}.pr.off{background:repeating-linear-gradient(-45deg,#FFF6EC 0 7px,#F1E3D3 7px 9px);box-shadow:inset 0 0 0 2px #8C93AE}.pr.off b{color:#4A5480}
.pr .sw{min-width:92px;height:44px;border-radius:8px;display:grid;place-items:center;font-weight:900;font-size:14px;background:#1D2A55;color:#FFF6EC}.pr.off .sw{background:#FFF6EC;color:#1D2A55;box-shadow:inset 0 0 0 2px #1D2A55}</style></head><body>
<main class="phone"><div class="hd"><b>タブを選ぶ</b><span class="unoff">非公式アプリ・見本</span></div><p class="lead">色の版を重ねて刷るように、タブを選びます。「刷らない」にすると白い紙に細い斜線だけ。</p><div class="pr" style="--c:#FFE14D"><b>ホーム</b><span style="font-weight:900;padding-right:10px">いつも</span></div><div class="pr" style="--c:#FF9DB8"><b>図鑑</b><span class="sw">刷る</span></div><div class="pr" style="--c:#9BE7C4"><b>フライト</b><span class="sw">刷る</span></div><div class="pr" style="--c:#9CC8FF"><b>運用</b><span class="sw">刷る</span></div><div class="pr" style="--c:#FFC48A"><b>修行</b><span class="sw">刷る</span></div><div class="pr off" style="--c:#ddd"><b>成績</b><span class="sw">刷らない</span></div>
<p style="font-weight:900;margin-top:16px">⟲ 全部刷り直す（全部乗せに戻す）</p></div></main>
<aside class="ann"><b>メモ（本番には出ません）</b>案R「蛍光の紙（孔版）」：タブは色の版。刷らない＝白い紙に細い斜線と枠。色と模様と字の3つで分かる</aside>
<script>if(window!==window.top){var a=document.querySelector('.ann');if(a)a.remove()}</script>
</body></html>
