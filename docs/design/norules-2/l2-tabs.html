<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>L2 タブを選ぶ｜決まりなしの実験 その2</title>
<style>*{box-sizing:border-box}html,body{margin:0}body{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans CJK JP","Noto Sans JP",system-ui,sans-serif;font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
.phone{position:relative;max-width:420px;min-height:100vh;min-height:100svh;margin:0 auto;overflow:hidden}
.ann{position:relative;z-index:99;max-width:392px;margin:16px auto 40px;font:13px/1.7 "Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans CJK JP","Noto Sans JP",system-ui,sans-serif;background:#FFF8D6;color:#5A4A12;padding:12px 14px;border-radius:16px}.ann b{display:block}
.unoff{font-size:13px}
body{background:#FBFAF5;color:#2D3340}.phone{background:#FBFAF5;background-image:linear-gradient(#DDE6F0 1px,transparent 1px),linear-gradient(90deg,#DDE6F0 1px,transparent 1px);background-size:16px 16px;padding:18px 18px 40px 40px}
.phone::before{content:"";position:absolute;left:28px;top:0;bottom:0;width:2px;background:#E8A0A0}
.date{font-size:14px;color:#55607A;font-weight:700}
h1{font-size:28px;margin:4px 0 0;transform:rotate(-1deg)}
.mk{background:linear-gradient(transparent 55%,#FFE36E 55%)}
.sk{margin:10px 0 0;transform:rotate(.8deg)}
.list{margin:12px 0 0;padding:0;list-style:none}.list li{display:flex;align-items:baseline;gap:10px;min-height:36px;font-size:16px}
.list li b{font-size:30px;font-weight:900;min-width:64px;text-align:right}.u{font-size:13px;color:#55607A}
.tape{display:inline-block;background:rgba(150,200,230,.55);padding:4px 12px;transform:rotate(-2deg);font-weight:800;margin-top:12px}
.tabs{display:flex;gap:5px;margin-top:18px}.tabs a{flex:1;min-height:48px;display:grid;place-items:center;padding:0 2px;white-space:nowrap;font-weight:800;font-size:13px;border:2px solid #2D3340;border-radius:14px 10px 16px 9px;background:#FBFAF5}
.tabs a.on{background:#2D3340;color:#FBFAF5}
.todo{display:flex;align-items:center;gap:12px;min-height:56px;font-size:19px;font-weight:700}
.box{width:44px;height:44px;display:grid;place-items:center;flex:none}.box i{width:28px;height:28px;border:2.5px solid #2D3340;border-radius:5px 7px 4px 6px;display:grid;place-items:center;font-style:normal;font-size:22px;font-weight:900;line-height:1}
.todo.off span.t{color:#5E6678;text-decoration:line-through;text-decoration-thickness:2px}.todo small{font-size:13px;color:#55607A;font-weight:600;margin-left:8px}</style></head><body>
<main class="phone"><div class="date">タブを選ぶ　<span class="unoff">非公式アプリ・見本</span></div><h1>出すタブに <span class="mk">✓</span></h1><p style="margin:6px 0 10px">チェックを外すと線で消します。5つまで。</p><div class="todo"><span class="box"><i>✓</i></span><span class="t">ホーム</span><small>いつも</small></div><div class="todo"><span class="box"><i>✓</i></span><span class="t">図鑑</span></div><div class="todo"><span class="box"><i>✓</i></span><span class="t">フライト</span></div><div class="todo"><span class="box"><i>✓</i></span><span class="t">運用</span></div><div class="todo"><span class="box"><i>✓</i></span><span class="t">修行</span></div><div class="todo off"><span class="box"><i></i></span><span class="t">成績</span><small>マイページで見る</small></div>
<span class="tape">全部に ✓ を付けなおす（全部乗せに戻す）</span></main>
<aside class="ann"><b>メモ（本番には出ません）</b>案L「方眼ノート」：タブはチェックリスト。外すと線で消す。✓ と取り消し線の2つで分かる</aside>
<script>if(window!==window.top){var a=document.querySelector('.ann');if(a)a.remove()}</script>
</body></html>
