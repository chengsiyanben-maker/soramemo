<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ストアの紹介画像 2｜そらメモ ストアに出すときの画面案</title>
<style>
:root{
  --gothic:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic","Meiryo","Noto Sans JP","Noto Sans CJK JP",system-ui,sans-serif;
  --sign:"Barlow Condensed","Arial Narrow",var(--gothic);
  --bg:#EEF1F5; --card:#FFFFFF; --ink:#374151; --strong:#1F2937; --sub:#5F6878; --mute:#6B7280; --line:#9CA3AF;
  --pill:rgba(17,24,39,.06); --hero:#0F1B2D; --on-hero:#F3F4F6; --hero-sub:#A7B0BC; --hero-pill:rgba(255,255,255,.10);
  --shadow:0 1px 2px rgba(17,24,39,.04),0 10px 30px -8px rgba(17,24,39,.10),inset 0 0 0 1px rgba(17,24,39,.07);
  --jal:#C8102E; --ana:#1C4FA0; --stub:#E7C873; --ok:#7EE2A8;
  --chart-sea:#DCEAF3; --chart-land:#F4F2EA; --chart-coast:#A9B9AE; --chart-apt:#7A1F5C; --chart-grid:rgba(31,78,121,.10);
  --tabs:rgba(255,255,255,.94); --demo-bg:#FFFFFF; --demo-ink:#374151;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0B0D10; --card:#16191F; --ink:#D1D5DB; --strong:#F3F4F6; --sub:#A7B0BC; --mute:#9AA3B0; --line:#4B5563;
  --pill:rgba(255,255,255,.08); --hero:#16233A; --on-hero:#F3F4F6; --hero-sub:#A7B0BC; --hero-pill:rgba(255,255,255,.10);
  --shadow:0 12px 26px -16px rgba(0,0,0,.7),inset 0 0 0 1px rgba(255,255,255,.06);
  --jal:#FF5A6E; --ana:#6EA0FF; --stub:#D9B95E; --ok:#7EE2A8;
  --chart-sea:#0F1A24; --chart-land:#1A1F24; --chart-coast:#3A4A42; --chart-apt:#E07AB5; --chart-grid:rgba(127,166,217,.10);
  --tabs:rgba(22,25,31,.94); --demo-bg:#262B33; --demo-ink:#D1D5DB;}}
:root[data-theme=dark]{
  --bg:#0B0D10; --card:#16191F; --ink:#D1D5DB; --strong:#F3F4F6; --sub:#A7B0BC; --mute:#9AA3B0; --line:#4B5563;
  --pill:rgba(255,255,255,.08); --hero:#16233A; --on-hero:#F3F4F6; --hero-sub:#A7B0BC; --hero-pill:rgba(255,255,255,.10);
  --shadow:0 12px 26px -16px rgba(0,0,0,.7),inset 0 0 0 1px rgba(255,255,255,.06);
  --jal:#FF5A6E; --ana:#6EA0FF; --stub:#D9B95E; --ok:#7EE2A8;
  --chart-sea:#0F1A24; --chart-land:#1A1F24; --chart-coast:#3A4A42; --chart-apt:#E07AB5; --chart-grid:rgba(127,166,217,.10);
  --tabs:rgba(22,25,31,.94); --demo-bg:#262B33; --demo-ink:#D1D5DB;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--gothic);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
.phone{position:relative;max-width:420px;min-height:100vh;min-height:100svh;margin:0 auto;overflow:hidden}
.card{background:var(--card);border-radius:22px;box-shadow:var(--shadow)}
.lab{font-size:13px;font-weight:700;color:var(--sub);letter-spacing:.02em}
.num{font-weight:800;color:var(--strong);letter-spacing:-.01em;line-height:1.1}
.u{font-size:12px;font-weight:600;color:var(--mute);margin-left:2px}
.hit{min-height:44px;min-width:44px}
.ic{width:44px;height:44px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--strong);font-weight:800;flex:none}
.ic svg,.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;width:calc(min(420px,100vw) - 28px);height:64px;border-radius:999px;background:var(--tabs);box-shadow:var(--shadow);display:flex;align-items:stretch;padding:0 8px;backdrop-filter:blur(12px);z-index:30}
.tabs b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;font-weight:700;color:var(--sub)}
.tabs b.on{color:var(--strong)}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ann{position:relative;z-index:40;max-width:392px;margin:16px auto 120px;font-size:13px;line-height:1.7;background:#FFF8D6;color:#5A4A12;padding:12px 14px;border-radius:16px}
.ann b{display:block;font-size:13px}
.ann ul{margin:4px 0 0;padding-left:1.2em}


.dim{position:fixed;inset:0;background:rgba(15,27,45,.38);z-index:50}
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(420px,100vw);background:var(--card);border-radius:28px 28px 0 0;box-shadow:0 -10px 40px -10px rgba(17,24,39,.25);z-index:60;padding:10px 16px 28px}
.sh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sh h3{margin:0;font-size:18px;color:var(--strong)}
.x{width:44px;height:44px;border-radius:999px;background:var(--pill);display:grid;place-items:center;font-size:18px;font-weight:800;color:var(--strong);flex:none}
.rw{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rw div{background:rgba(255,255,255,.06);border-radius:18px;padding:10px 14px}
.rw small{display:block;font-size:13px;font-weight:700;color:var(--hero-sub)}
.rw b{font-family:var(--sign);font-size:40px;line-height:1.05;letter-spacing:.02em}
.ix{display:block;padding:10px;text-decoration:none}
.wrap{padding:14px 16px 130px}
.bar{display:flex;align-items:center;gap:8px}
.back{height:44px;display:flex;align-items:center;font-size:14px;font-weight:800;color:var(--strong);background:var(--card);box-shadow:var(--shadow);border-radius:999px;padding:0 14px 0 12px;flex:none}
.ap{height:44px;display:flex;align-items:center;gap:8px;background:var(--card);box-shadow:var(--shadow);border-radius:999px;padding:0 16px 0 8px;font-weight:800;color:var(--strong)}
.ap i{font-style:normal;background:var(--strong);color:var(--card);border-radius:999px;padding:2px 9px;font-size:13px}
h1.t{font-size:26px;line-height:1.3;color:var(--strong);margin:28px 4px 0;letter-spacing:.01em}
p.lead{font-size:15px;color:var(--ink);margin:10px 4px 0;line-height:1.7}
.note{font-size:13px;color:var(--sub);margin:12px 4px 0;line-height:1.6}
.rows{margin-top:20px;padding:6px 18px}
.row{display:flex;gap:14px;align-items:flex-start;padding:14px 0}
.row+.row{box-shadow:0 -1px 0 var(--pill)}
.row .n{width:32px;height:32px;border-radius:999px;background:var(--pill);display:grid;place-items:center;font-weight:800;color:var(--strong);flex:none;font-size:14px}
.row b{display:block;color:var(--strong);font-size:15px;line-height:1.45}
.row small{display:block;color:var(--sub);font-size:13px;line-height:1.55;margin-top:2px}
.foot{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(420px,100vw);padding:12px 16px 22px;background:linear-gradient(180deg,transparent,var(--bg) 22%);z-index:30;display:flex;flex-direction:column;gap:8px}
.btn{height:52px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800}
.btn.pri{background:var(--strong);color:var(--card)}
.btn.sec{background:var(--card);color:var(--strong);box-shadow:var(--shadow)}
.btn.ghost{color:var(--sub);height:44px;font-size:15px}
.btn.danger{background:var(--jal);color:#fff}
.btn.off{background:var(--pill);color:var(--mute)}
.pl{height:44px;display:inline-flex;align-items:center;padding:0 16px;border-radius:999px;font-size:14px;font-weight:800;background:var(--pill);color:var(--strong)}
.pl.dark{background:var(--strong);color:var(--card)}
.chip{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;font-size:13px;font-weight:800;background:var(--pill);color:var(--strong)}
.chip.warn{background:#FDECC8;color:#6B4A00}
.chip.ok{background:#DDF5E7;color:#14532D}
.chip.red{background:#FBE3E6;color:#8A1023}
.os{margin:22px auto 0;width:300px;background:rgba(242,242,247,.96);border-radius:16px;box-shadow:0 20px 50px -10px rgba(0,0,0,.35);overflow:hidden;text-align:center;color:#111}
.os .h{padding:18px 16px 12px}
.os .h b{display:block;font-size:16px;line-height:1.35}
.os .h small{display:block;font-size:13px;line-height:1.45;color:#333;margin-top:6px}
.os .o{min-height:44px;display:flex;align-items:center;justify-content:center;font-size:16px;color:#0A60D6;box-shadow:0 -1px 0 rgba(60,60,67,.2)}
.os .o.on{font-weight:700}
.osl{font-size:13px;color:var(--sub);text-align:center;margin:8px 0 0}
.map{position:relative;height:330px;margin:-14px -16px 0;overflow:hidden}
.map svg{display:block;width:100%;height:100%}
.sheet2{position:relative;margin:-26px -16px 0;background:var(--bg);border-radius:28px 28px 0 0;padding:10px 16px 0;box-shadow:0 -8px 30px -12px rgba(17,24,39,.18)}
.grip{width:44px;height:5px;border-radius:999px;background:var(--line);opacity:.6;margin:0 auto 12px}
.cardp{padding:16px 18px}
.cardp h3{margin:0;font-size:17px;color:var(--strong);line-height:1.4}
.cardp p{margin:6px 0 0;font-size:14px;color:var(--ink);line-height:1.65}
.btns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btns .pl{flex:1;justify-content:center}
.banner{display:flex;gap:10px;align-items:flex-start;margin-top:12px;padding:12px 16px;border-radius:18px;background:#FFF4D6;color:#5A4A12;font-size:13px;line-height:1.55}
.banner b{display:block;font-size:14px;color:#3F3200}
.banner .dot{width:10px;height:10px;border-radius:999px;background:#C99A1A;flex:none;margin-top:6px}
.tog{width:52px;height:32px;border-radius:999px;background:var(--line);position:relative;flex:none}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:999px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.tog.on{background:#1F7A4D}
.tog.on::after{left:23px}
.tog.dis{opacity:.45}
.set{display:flex;align-items:center;gap:12px;min-height:64px;padding:10px 0}
.set+.set{box-shadow:0 -1px 0 var(--pill)}
.set div{flex:1}
.set b{display:block;color:var(--strong);font-size:15px;line-height:1.45}
.set small{display:block;color:var(--sub);font-size:13px;line-height:1.5}
.sec-h{font-size:14px;font-weight:800;color:var(--sub);margin:22px 4px 0}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.stat .card{padding:12px 16px}
.stat .num{font-size:30px;margin-top:2px}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:10px 0;font-size:14px}
.kv+.kv{box-shadow:0 -1px 0 var(--pill)}
.kv span{color:var(--sub)}
.kv b{color:var(--strong);text-align:right}
.inp{height:56px;border-radius:16px;background:var(--card);box-shadow:var(--shadow);display:flex;align-items:center;padding:0 18px;font-size:20px;font-weight:800;color:var(--strong);margin-top:10px;letter-spacing:.1em}
.inp .cur{display:inline-block;width:2px;height:24px;background:var(--strong);margin-left:2px}
.li{display:flex;gap:12px;align-items:flex-start;padding:12px 0;font-size:14px;line-height:1.55}
.li+.li{box-shadow:0 -1px 0 var(--pill)}
.li i{font-style:normal;width:24px;height:24px;border-radius:999px;display:grid;place-items:center;font-size:13px;font-weight:800;flex:none;margin-top:1px}
.li i.x{background:#FBE3E6;color:#8A1023}
.li i.k{background:#DDF5E7;color:#14532D}
.li b{display:block;color:var(--strong)}
.li small{display:block;color:var(--sub);font-size:13px}
.src{padding:6px 18px}
.src .s{padding:14px 0}
.src .s+.s{box-shadow:0 -1px 0 var(--pill)}
.src .s b{display:block;color:var(--strong);font-size:15px}
.src .s small{display:block;color:var(--sub);font-size:13px;line-height:1.6;margin-top:2px}
.src .s a{display:inline-flex;align-items:center;min-height:44px;font-size:14px;font-weight:700;color:var(--ana);text-decoration:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:94px;width:calc(min(420px,100vw) - 32px);background:var(--hero);color:var(--on-hero);border-radius:18px;padding:12px 16px;font-size:14px;line-height:1.55;z-index:35;box-shadow:0 12px 30px -10px rgba(0,0,0,.4)}
.toast b{display:block}
.stubc{background:var(--hero);color:var(--on-hero);border-radius:24px;padding:16px 18px;display:flex;gap:14px;align-items:center}
.stubc .code{font-family:var(--sign);font-size:44px;font-weight:800;letter-spacing:.06em;line-height:1}
.stubc small{display:block;color:var(--hero-sub);font-size:13px}
.stubc b{display:block;font-size:16px}
.stubc .km{margin-left:auto;text-align:right;font-family:var(--sign);font-size:30px;font-weight:800}
.stubc .km small{display:inline;margin-left:2px;font-family:var(--gothic);font-size:12px}


html,body{background:#E9EDF3}
.ss{position:relative;width:430px;height:932px;overflow:hidden;margin:0 auto;background:linear-gradient(180deg,#F4F6F9 0%,#E6EBF2 100%);font-family:var(--gothic)}
.ss .hd{position:absolute;left:32px;right:32px;top:70px}
.ss .hd h1{margin:0;font-size:38px;line-height:1.3;font-weight:800;color:#1F2937;letter-spacing:.01em}
.ss .hd p{margin:12px 0 0;font-size:18px;line-height:1.6;color:#4B5563}
.ss .dev{position:absolute;left:50%;transform:translateX(-50%);top:300px;width:330px;height:700px;border-radius:48px;background:#0F1B2D;padding:12px;box-shadow:0 30px 60px -20px rgba(15,27,45,.45)}
.ss .scr{width:100%;height:100%;border-radius:38px;overflow:hidden;background:var(--bg);position:relative}
.ss .uo{position:absolute;left:32px;bottom:26px;right:32px;display:flex;justify-content:space-between;align-items:center;z-index:5}
.ss .uo span{height:40px;display:inline-flex;align-items:center;padding:0 16px;border-radius:999px;background:rgba(31,41,55,.12);color:#1F2937;font-size:15px;font-weight:800}
.ss .uo b{font-size:15px;color:#1F2937}
.ss .fade{position:absolute;left:0;right:0;bottom:0;height:150px;background:linear-gradient(180deg,rgba(230,235,242,0),#E6EBF2 70%);z-index:4}
.mini2{padding:12px}
.m-card{background:#fff;border-radius:18px;box-shadow:var(--shadow);padding:12px 14px;margin-top:10px}
.m-card .lab{font-size:13px}
.stamp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stamp div{background:var(--hero);color:#F3F4F6;border-radius:14px;padding:10px 0;text-align:center}
.stamp div b{display:block;font-family:var(--sign);font-size:26px;letter-spacing:.06em;line-height:1}
.stamp div small{display:block;font-size:13px;color:#A7B0BC}

</style>
</head>
<body>

<div class="ss" role="img" aria-label="ストアの紹介画像 2">
<div class="hd"><h1>乗った便が、<br>自分の路線図になる</h1><p>印と印をつなぐと、乗った区間が残ります。距離と回数も。</p></div>
<div class="dev"><div class="scr">
<div style="height:380px;position:relative"><svg viewBox="0 0 306 380" style="width:100%;height:100%" role="img" aria-label="乗った区間の地図"><rect width="306" height="380" fill="var(--chart-sea)"/><path d="M180 0H306V380H60C70 330 110 300 120 260C135 210 100 180 130 140C150 110 170 60 180 0Z" fill="var(--chart-land)" stroke="var(--chart-coast)" stroke-width="1.4"/><g fill="none" stroke="#7A1F5C" stroke-width="2.5" stroke-linecap="round"><path d="M210 230 Q170 250 140 280"/><path d="M210 230 Q240 120 250 50"/><path d="M140 280 Q110 320 80 350"/><path d="M210 230 Q160 300 80 350"/></g><g fill="#7A1F5C"><circle cx="210" cy="230" r="6"/><circle cx="140" cy="280" r="6"/><circle cx="250" cy="50" r="6"/><circle cx="80" cy="350" r="6"/></g><g font-size="13" font-weight="800" fill="#1F2937"><text x="220" y="236">HND</text><text x="148" y="298">ITM</text><text x="258" y="56">CTS</text><text x="88" y="368">FUK</text></g></svg></div>
<div class="mini2"><div class="stat" style="margin-top:0"><div class="card" style="padding:10px 12px"><div class="lab">今年乗った便</div><div class="num" style="font-size:28px">42<span class="u">便</span></div></div><div class="card" style="padding:10px 12px"><div class="lab">距離</div><div class="num" style="font-size:28px">31,840<span class="u">km</span></div></div></div></div>
</div></div>
<div class="fade"></div>
<div class="uo"><span>非公式アプリ</span><b>航空会社や空港とは関係ありません</b></div>
</div>
<aside class="ann"><b>メモ（本番には出ません）</b><ul><li>2枚目は乗った便の記録（フライト）。数字は見本。航空会社名は出さない（案C：会社名が入る画像だけ「関係ありません」が要るが、ここでは全部に入れる）</li></ul></aside>
<script>if(window!==window.top){var a=document.querySelector('.ann');if(a)a.remove()}</script>
</body>
</html>
