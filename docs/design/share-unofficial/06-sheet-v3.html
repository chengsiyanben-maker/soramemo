function proj(lat, lon){ return [(lon-122.5)*16.4*0.82+20, (46.2-lat)*17.6+14]; }
function mapCard(v){
  const [cv, ctx] = cardBase(v, "");

function yearCard(v){

// 写真：見本は描いた夕方の空（他人の写真は使わない）
function samplePhoto(){
  const w = 1600, h = 1200, cv = document.createElement("canvas"); cv.width = w; cv.height = h; const ctx = cv.getContext("2d");
