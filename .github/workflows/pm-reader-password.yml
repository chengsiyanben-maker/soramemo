# pm_reader にパスワードを付ける（手で動かすだけ・PM が使う）
#   本人が Secrets に入れた PM_READER_URL の中のパスワードを、本体（postgres）の接続で pm_reader に付ける。
#   本人が SQL Editor を開かずに済むようにする（11/27 本人の不在のあいだ）。パスワードはログに出さない。
#   使う秘密の設定：PM_READER_URL・SUPABASE_DB_PASSWORD
name: pm_reader のパスワードを付ける
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pm-reader-password
  cancel-in-progress: false
jobs:
  set:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: psql を用意する
        run: command -v psql || (sudo apt-get update -q && sudo apt-get install -y -q postgresql-client)
      - name: パスワードを付ける
        env:
          PM_READER_URL: ${{ secrets.PM_READER_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -eu
          if [ -z "${PM_READER_URL:-}" ] || [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then echo "秘密の設定が足りない"; exit 2; fi
          python3 - <<'PY' > /tmp/parts
          import os, sys, urllib.parse as u
          # 文字列の中身は、どんな失敗でもログに出さない（例外の文章に混ざるのを防ぐため、自前で分ける）
          try:
              raw = os.environ['PM_READER_URL'].strip()
              rest = raw.split('://', 1)[1] if '://' in raw else raw
              cred, hostpart = rest.rsplit('@', 1)
              user, pw = cred.split(':', 1)
              user = u.unquote(user); pw = u.unquote(pw)
              hp = hostpart.split('/', 1)[0].split('?', 1)[0]
              hostname, _, port = hp.partition(':')
          except Exception:
              sys.exit('止めた：PM_READER_URL を読み取れない（中身は出していない）')
          role = user.split('.', 1)[0]
          print(f'診断：役割名={role or "(なし)"} 接続先={hostname} パスワードの長さ={len(pw)}', file=sys.stderr)
          if pw and pw == os.environ['SUPABASE_DB_PASSWORD']:
              sys.exit('止めた：本体（postgres）と同じパスワードは pm_reader に付けない')
          if role != 'pm_reader': sys.exit(f'止めた：ユーザー名が pm_reader ではない（{role}）')
          if len(pw) < 16: sys.exit('止めた：パスワードが短い（16文字以上）')
          if not pw.isalnum(): sys.exit('止めた：パスワードは英数字だけにしてください（記号は接続文字列を壊すため）')
          ref = user.split('.', 1)[1] if '.' in user else 'bygwdoypfrccgfjjrorc'
          host = hostname if hostname.endswith('pooler.supabase.com') else 'aws-0-ap-northeast-1.pooler.supabase.com'
          port = port if (host == hostname and port.isdigit()) else '5432'
          print(ref); print(host); print(port); print(pw)
          PY
          REF=$(sed -n 1p /tmp/parts); HOST=$(sed -n 2p /tmp/parts); PORT=$(sed -n 3p /tmp/parts); PW=$(sed -n 4p /tmp/parts); rm -f /tmp/parts
          echo "::add-mask::$PW"
          export PGPASSWORD="$SUPABASE_DB_PASSWORD"
          psql "host=$HOST port=$PORT dbname=postgres user=postgres.$REF sslmode=require" -v ON_ERROR_STOP=1 -q -v pw="$PW" <<'SQL'
          alter role pm_reader with login password :'pw';
          SQL
          unset PGPASSWORD
          echo "付けた。pm_reader でつながるか確かめる"
          export PGPASSWORD="$PW"
          psql "host=$HOST port=$PORT dbname=postgres user=pm_reader.$REF sslmode=require" -tA -c "select current_user, current_setting('default_transaction_read_only'), (select count(*) from public.airports)"
          if psql "host=$HOST port=$PORT dbname=postgres user=pm_reader.$REF sslmode=require" -tA -c "select count(*) from public.checkins" 2>/dev/null; then echo "利用者の表が読めてしまう"; exit 3; else echo "利用者の表（checkins）は断られた＝正しい"; fi
