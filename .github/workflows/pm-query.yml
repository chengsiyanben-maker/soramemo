# PM の読むだけの問い合わせ（11/27 本人の指示・data/pm-reader）
#   tools/pm-queries/ の .sql を1つ、役割 pm_reader（読むだけ）で本番に流し、結果の CSV（最大20万行）を artifact に置く。
#   流す前に tools/pm_query.mjs が中身を確かめ、select / with で始まる1文でなければ断る。取引は read only・1文60秒・全体10分まで。
#   必要な設定（リポジトリの Settings → Secrets and variables → Actions → Secrets）：
#     PM_READER_URL … pm_reader の接続の文字列（Session pooler。作り方は docs/pm/report-pm-reader.md）
#   公開のリポジトリの artifact は GitHub にログインした誰でも落とせるので、ODPT の便のデータを配らないために、
#   結果は毎回つくる使い捨ての鍵（AES256）で暗号にし、その鍵を PM の公開鍵 tools/pm-queries/pm_result_pub.pem で包んで置く。
#   開けるのは対の秘密鍵を持つ PM だけ（秘密鍵はリポジトリ・ログ・プルリクエストに置かない）。合言葉の秘密の設定は要らない。
#   パスワードはこのファイル・ログ・プルリクエストに書かない。結果の中身はログに出さない（行数と秒だけ）。
name: PM の読むだけの問い合わせ
on:
  workflow_dispatch:
    inputs:
      query:
        description: "tools/pm-queries/ の中の .sql のファイル名（例 promo_day.sql）"
        required: true
        type: string
      params:
        description: "変数（空白で区切る。例 airline=JL day=2026-11-20）"
        required: false
        default: ""
        type: string
concurrency:
  group: pm-query
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  query:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: psql を用意する
        run: command -v psql || (sudo apt-get update -q && sudo apt-get install -y -q postgresql-client)
      - name: 中身を確かめる（つながない）
        env:
          PM_QUERY: ${{ inputs.query }}
          PM_PARAMS: ${{ inputs.params }}
        run: |
          node tools/pm_query.mjs --check
      - name: 読むだけで流す
        env:
          PM_QUERY: ${{ inputs.query }}
          PM_PARAMS: ${{ inputs.params }}
          PM_READER_URL: ${{ secrets.PM_READER_URL }}
        run: node tools/pm_query.mjs
      - name: 結果を暗号にする（PM の公開鍵で包む）
        run: |
          rm -f out/.raw.csv out/.wrap.sql
          for f in out/*.csv; do
            openssl rand -out "$f.k" 32
            openssl enc -aes-256-cbc -pbkdf2 -salt -in "$f" -out "$f.enc" -pass file:"$f.k"
            openssl pkeyutl -encrypt -pubin -inkey tools/pm-queries/pm_result_pub.pem -pkeyopt rsa_padding_mode:oaep -in "$f.k" -out "$f.key"
            rm -f "$f" "$f.k"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: pm-query-${{ github.run_id }}
          path: |
            out/*.csv.enc
            out/*.csv.key
          retention-days: 1
          if-no-files-found: error
