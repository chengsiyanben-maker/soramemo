# PM の読むだけの問い合わせ（11/27 本人の指示・data/pm-reader）
#   tools/pm-queries/ の .sql を1つ、役割 pm_reader（読むだけ）で本番に流し、結果の CSV（最大20万行）を artifact に置く。
#   流す前に tools/pm_query.mjs が中身を確かめ、select / with で始まる1文でなければ断る。取引は read only・1文60秒・全体10分まで。
#   必要な設定（リポジトリの Settings → Secrets and variables → Actions → Secrets）：
#     PM_READER_URL … pm_reader の接続の文字列（Session pooler。作り方は docs/pm/report-pm-reader.md）
#     PM_RESULT_KEY … 結果の CSV を暗号にする合言葉（リポジトリが公開のあいだは必須。ないと流さない）
#   公開のリポジトリの artifact は GitHub にログインした誰でも落とせるので、ODPT の便のデータを配らないために、
#   公開のあいだは結果を gpg（AES256）で暗号にしてから置く。非公開のリポジトリなら合言葉なしで CSV のまま置く。
#   開け方：gpg --batch --passphrase-file 合言葉のファイル -d ファイル.csv.gpg > ファイル.csv
#   パスワードと合言葉はこのファイル・ログ・プルリクエストに書かない。結果の中身はログに出さない（行数と秒だけ）。
name: PM の読むだけの問い合わせ
on:
  workflow_dispatch:
    inputs:
      query:
        description: "tools/pm-queries/ の中の .sql のファイル名（例 promo_day.sql）"
        required: true
        type: string
      params:
        description: "変数（空白で区切る。例 airline=JL day=2026-11-20）"
        required: false
        default: ""
        type: string
concurrency:
  group: pm-query
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  query:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: psql を用意する
        run: command -v psql || (sudo apt-get update -q && sudo apt-get install -y -q postgresql-client)
      - name: 中身を確かめる（つながない）
        env:
          PM_QUERY: ${{ inputs.query }}
          PM_PARAMS: ${{ inputs.params }}
          IS_PUBLIC: ${{ github.event.repository.private == false }}
          HAS_KEY: ${{ secrets.PM_RESULT_KEY != '' }}
        run: |
          if [ "$IS_PUBLIC" = "true" ] && [ "$HAS_KEY" != "true" ]; then
            echo "断った：リポジトリが公開なので、結果を暗号にする合言葉 PM_RESULT_KEY がないと流さない（docs/pm/report-pm-reader.md）"; exit 2
          fi
          node tools/pm_query.mjs --check
      - name: 読むだけで流す
        env:
          PM_QUERY: ${{ inputs.query }}
          PM_PARAMS: ${{ inputs.params }}
          PM_READER_URL: ${{ secrets.PM_READER_URL }}
        run: node tools/pm_query.mjs
      - name: 結果を暗号にする（合言葉があるとき）
        env:
          PM_RESULT_KEY: ${{ secrets.PM_RESULT_KEY }}
        run: |
          rm -f out/.raw.csv out/.wrap.sql
          if [ -n "$PM_RESULT_KEY" ]; then
            for f in out/*.csv; do
              printf '%s' "$PM_RESULT_KEY" | gpg --batch --yes --quiet --pinentry-mode loopback --passphrase-fd 0 --symmetric --cipher-algo AES256 -o "$f.gpg" "$f"
              rm -f "$f"
            done
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: pm-query-${{ github.run_id }}
          path: |
            out/*.csv
            out/*.csv.gpg
          retention-days: 7
          if-no-files-found: error
