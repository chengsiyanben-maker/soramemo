<!-- 試遊版だけ：読み込み中の幕と、時間を進める帯 -->
<style>
#playLoad{position:fixed;inset:0;z-index:999;background:#13213D;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px max(24px,env(safe-area-inset-right,0px)) 24px max(24px,env(safe-area-inset-left,0px));text-align:center;font-family:var(--gothic,system-ui,sans-serif)}
#playLoad b{font-family:var(--sign,system-ui);font-size:40px;letter-spacing:.06em}
#playLoad p{margin:0;font-size:14px;opacity:.8;line-height:1.7;max-width:22em}
#playLoad i{width:120px;height:4px;border-radius:2px;background:rgba(255,255,255,.18);overflow:hidden;position:relative}
#playLoad i::after{content:"";position:absolute;inset:0;width:40%;background:#fff;border-radius:2px;animation:playBar 1.2s ease-in-out infinite alternate}
@keyframes playBar{from{transform:translateX(-10%)}to{transform:translateX(160%)}}
@media (prefers-reduced-motion:reduce){#playLoad i::after{animation:none}}
#playBar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 96px);z-index:998;display:flex;align-items:center;gap:6px;padding:5px 6px 5px 12px;border-radius:999px;background:#13213D;color:#fff;box-shadow:0 8px 24px -8px rgba(6,12,24,.5);font-family:var(--gothic,system-ui,sans-serif);font-size:12px;max-width:calc(100vw - 24px);white-space:nowrap}
#playBar .pd{display:flex;flex-direction:column;line-height:1.15;margin-right:4px}
#playBar .pd small{font-size:10px;opacity:.7}
#playBar .pd b{font-family:var(--sign,system-ui);font-size:15px;font-variant-numeric:tabular-nums}
#playBar button{font:inherit;font-size:12px;font-weight:700;height:30px;padding:0 11px;border-radius:15px;border:0;background:#fff;color:#13213D;cursor:pointer}
#playBar button.ghost{background:rgba(255,255,255,.14);color:#fff}
#playBar button:focus-visible{outline:2px solid #8FB4FF;outline-offset:2px}
#playBar button[disabled]{opacity:.5;cursor:default}
#playMenu{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 140px);z-index:998;width:min(340px,calc(100vw - 32px));background:#fff;color:#2A2F38;border-radius:18px;box-shadow:0 18px 40px -12px rgba(6,12,24,.35);padding:14px;display:flex;flex-direction:column;gap:8px;font-family:var(--gothic,system-ui,sans-serif);font-size:13px}
#playMenu button{font:inherit;font-weight:700;height:40px;border-radius:20px;border:1px solid #D9DCE1;background:#fff;color:#13213D;cursor:pointer}
#playMenu button.danger{color:#A3321F;border-color:#EBC9C2}
#playMenu p{margin:0;color:#5F6672;font-size:12px;line-height:1.6}
#playMenu .row{display:flex;gap:8px}#playMenu .row button{flex:1}
#playBusy{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 10px);z-index:999;display:flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;background:#13213D;color:#fff;font-family:var(--gothic,system-ui,sans-serif);font-size:12px;font-weight:700;box-shadow:0 8px 24px -8px rgba(6,12,24,.5);pointer-events:none}
#playBusy span{width:12px;height:12px;border-radius:50%;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;animation:playSpin .8s linear infinite}
@keyframes playSpin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){#playBusy span{animation:none}}
#playMenu{max-height:min(70vh,560px);overflow:auto}
#playMenu h4{margin:6px 0 0;font-size:12px;color:#13213D;letter-spacing:.06em}
#playMenu .pm-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
#playMenu .pm-row>span,#playMenu .pm-row>label{font-size:12px;color:#5F6672;min-width:3.5em}
#playMenu .pm-row button{height:34px;padding:0 12px;border-radius:17px;font-size:12px}
#playMenu .pm-row select,#playMenu .pm-row input{height:34px;border-radius:17px;border:1px solid #D9DCE1;padding:0 10px;font:inherit;font-size:12px;background:#fff;color:#2A2F38;max-width:100%;min-width:0;flex:1}
#playMenu #pmSat{flex:0 0 70px}
#pmMsg{color:#0F7A4A !important;font-weight:700;min-height:1em}
</style>
<div id="playLoad" role="status" aria-live="polite"><b>SORAMEMO</b><i aria-hidden="true"></i><p>試遊版を準備しています</p></div>
<div id="playBusy" role="status" aria-live="polite" hidden><span aria-hidden="true"></span>計算しています</div>
<div id="playBar" role="region" aria-label="試遊版の操作">
  <span class="pd"><small>試遊版</small><b id="playDay">0日目</b></span>
  <button type="button" id="playAdv1">1日進める</button>
  <button type="button" class="ghost" id="playMore" aria-expanded="false" aria-controls="playMenu">ほか</button>
</div>
<div id="playMenu" hidden>
  <div class="pm-row"><button type="button" id="playAdv7">7日進める（1分半ほど）</button></div>
  <h4>会社</h4>
  <div class="pm-row" role="group" aria-label="格付け"><span>格付け</span><button type="button" data-pm="rating" data-v="1">1</button><button type="button" data-pm="rating" data-v="2">2</button><button type="button" data-pm="rating" data-v="3">3</button><button type="button" data-pm="rating" data-v="4">4</button><button type="button" data-pm="rating" data-v="5">5</button></div>
  <div class="pm-row"><label for="pmSat">満足度</label><input id="pmSat" type="number" min="0" max="100" step="1" value="60"><button type="button" data-pm="sat">決める</button></div>
  <div class="pm-row"><span>資金</span><button type="button" data-pm="cash" data-v="10000">＋1億円</button><button type="button" data-pm="cash" data-v="100000">＋10億円</button><button type="button" data-pm="cash" data-v="1000000">＋100億円</button></div>
  <h4>乗る・見る</h4>
  <div class="pm-row"><select id="pmFrom" aria-label="出発の空港"></select><span>→</span><select id="pmTo" aria-label="到着の空港"></select></div>
  <div class="pm-row"><select id="pmType" aria-label="機種"></select><button type="button" data-pm="fly">きのう乗ったことにする</button></div>
  <div class="pm-row"><select id="pmSeenAp" aria-label="見る空港"></select><button type="button" data-pm="seen">この機種を見たことにする</button></div>
  <h4>空と季節</h4>
  <div class="pm-row"><select id="pmWxAp" aria-label="天気を起こす空港"></select></div>
  <div class="pm-row"><button type="button" data-pm="typhoon">あした台風</button><button type="button" data-pm="wx" data-v="snow">雪</button><button type="button" data-pm="wx" data-v="fog">霧</button><button type="button" data-pm="wx" data-v="wind">強風</button><button type="button" data-pm="wx" data-v="ts">雷</button></div>
  <div class="pm-row"><select id="pmRoute" aria-label="欠航させる路線"></select><button type="button" data-pm="cxl" data-v="0.3">今日3割欠航</button><button type="button" data-pm="cxl" data-v="1">全便欠航</button></div>
  <div class="pm-row"><span>季節</span><button type="button" data-pm="season" data-v="12-30">年末年始</button><button type="button" data-pm="season" data-v="08-12">お盆</button><button type="button" data-pm="season" data-v="03-25">春休み</button><button type="button" data-pm="season" data-v="">今日に戻す</button></div>
  <div class="pm-row"><input id="pmDay" type="date" aria-label="日付"><button type="button" data-pm="seasonDay">この日にする</button></div>
  <p id="pmMsg" role="status" aria-live="polite"></p>
  <p>試遊版は、本番と同じ計算をこの端末の中で動かしています。便の記録は本物に似せた見本で、本番のデータとは別です。チートで変えたものも、この端末の中だけです。</p>
  <button type="button" class="danger" id="playReset">はじめから（見本の会社に戻す）</button>
  <p id="playResetNote" hidden>もう一度押すと、進めた日と買った機体がすべて消えます。</p>
</div>
<script>
(function(){
  const $p = (id) => document.getElementById(id);
  const busy = (on, label) => { ["playAdv1","playMore","playAdv7","playReset"].forEach(id => $p(id).disabled = on); if(label) $p("playAdv1").textContent = label; };
  async function refresh(){
    try{ const i = await window.play.info(); $p("playDay").textContent = i.d + "日目"; }catch(e){}
    try{ if(typeof reload === "function") await reload(); }catch(e){}
    try{ if(typeof loadCompanyServer === "function"){ await loadCompanyServer(); DIRTY.game = true; renderVisible(); } }catch(e){}
  }
  async function adv(n){
    $p("playMenu").hidden = true; $p("playMore").setAttribute("aria-expanded", "false");
    busy(true, n === 1 ? "進めています" : n + "日ぶん進めています");
    try{ await window.play.advance(n); await refresh(); }catch(e){ console.error(e); $p("playDay").textContent = "進められませんでした"; }
    busy(false, "1日進める");
  }
  window.addEventListener("play-ready", refresh);
  $p("playAdv1").onclick = () => adv(1);
  $p("playAdv7").onclick = () => adv(7);
  $p("playMore").onclick = () => { const m = $p("playMenu"); m.hidden = !m.hidden; $p("playMore").setAttribute("aria-expanded", String(!m.hidden)); if(!m.hidden){ fillLists(); fillRoutes(); } };

  // チート
  const msg = (t, bad) => { const m = $p("pmMsg"); m.textContent = t; m.style.color = bad ? "#A3321F" : ""; };
  let listsDone = false;
  async function fillLists(){
    if(listsDone) return; listsDone = true;
    const aps = (typeof A !== "undefined" ? A : []).filter(a => a.iata).sort((x, y) => x.iata.localeCompare(y.iata));
    const opt = (v, l, sel) => `<option value="${v}"${sel ? " selected" : ""}>${l}</option>`;
    const apOpts = d => aps.map(a => opt(a.iata, `${a.iata} ${typeof apNm === "function" ? apNm(a.iata) : a.name}`, a.iata === d)).join("");
    $p("pmFrom").innerHTML = apOpts("HND"); $p("pmTo").innerHTML = apOpts("ISG"); $p("pmSeenAp").innerHTML = apOpts("NRT"); $p("pmWxAp").innerHTML = apOpts("CTS");
    try{ const t = await window.play.sql(`select code, name from co3_types where kind in ('pax', 'small') order by name`); $p("pmType").innerHTML = t.map(x => opt(x.code, x.name, x.code === "B789")).join(""); }catch(e){}
  }
  function fillRoutes(){ const rs = (typeof coRoutes === "function" && CO) ? coRoutes() : []; $p("pmRoute").innerHTML = rs.map(r => `<option value="${r.a.iata}-${r.b.iata}">${apNm(r.a.iata)} ⇄ ${apNm(r.b.iata)}</option>`).join(""); }
  const U = () => window.play.uid;
  async function cheat(b){
    const k = b.dataset.pm, v = b.dataset.v;
    const md = s => { const t = new Date(Date.now() + 9 * 36e5); let y = t.getUTCFullYear(); const d = `${y}-${s}`; return d < t.toISOString().slice(0, 10) ? `${y + 1}-${s}` : d; };
    const run = {
      rating: () => window.play.sql(`select play.set_company($1, $2::int)`, [U(), v]).then(() => `格付けを${v}にしました`),
      sat: () => window.play.sql(`select play.set_company($1, null, $2::numeric)`, [U(), $p("pmSat").value]).then(() => `満足度を${$p("pmSat").value}にしました`),
      cash: () => window.play.sql(`select play.set_company($1, null, null, $2::bigint)`, [U(), v]).then(() => `資金を足しました`),
      fly: () => window.play.sql(`select play.add_flight($1, $2, $3, $4) v`, [U(), $p("pmFrom").value, $p("pmTo").value, $p("pmType").value]).then(r => { if(typeof HANGAR !== "undefined") HANGAR = null; return `${$p("pmFrom").value}→${$p("pmTo").value} に ${r[0].v} で乗ったことにしました（機体の「買う」→「乗った」に出ます）`; }),
      seen: () => window.play.sql(`select play.add_seen($1, $2, array[$3]) v`, [U(), $p("pmSeenAp").value, $p("pmType").value]).then(() => { if(typeof SEEN !== "undefined") SEEN = null; return `${$p("pmSeenAp").value}で見たことにしました（機体の「買う」→「見た」に出ます）`; }),
      typhoon: () => window.play.sql(`select play.typhoon($1)`, [$p("pmWxAp").value]).then(() => `あした${$p("pmWxAp").value}に台風が近づく予報にしました`),
      wx: () => window.play.sql(`select play.weather($1, $2)`, [$p("pmWxAp").value, v]).then(() => `今日の${$p("pmWxAp").value}を${b.textContent}にしました`),
      cxl: () => { const [a, c] = $p("pmRoute").value.split("-"); return window.play.sql(`select play.cancel($1, $2, $3::numeric) v`, [a, c, v]).then(r => `今日の${a}⇄${c}の本物そっくりの便を ${r[0].v}便 欠航にしました`); },
      season: () => window.play.sql(`select play.set_season($1::date)`, [v ? md(v) : null]).then(() => v ? `今日を ${md(v)} として扱います` : "今日に戻しました"),
      seasonDay: () => window.play.sql(`select play.set_season($1::date)`, [$p("pmDay").value || null]).then(() => `今日を ${$p("pmDay").value} として扱います`),
    }[k];
    if(!run) return;
    b.disabled = true;
    try{ msg(await run()); await refresh(); fillRoutes(); }catch(e){ msg("できませんでした：" + String(e.message || e).split("\n")[0], true); }
    b.disabled = false;
  }
  document.addEventListener("click", e => { const b = e.target.closest("#playMenu [data-pm]"); if(b) cheat(b); });
  let armed = false;
  $p("playReset").onclick = () => { if(!armed){ armed = true; $p("playResetNote").hidden = false; $p("playReset").textContent = "本当にはじめからにする"; return; } window.play.reset(); };
})();
</script>
